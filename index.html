<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/" />
  <title>时雨榧</title>
  <meta name="description" content="时雨榧 — 个人主页" />
  <meta name="theme-color" content="#f7f8fc" />
  <link rel="stylesheet" href="css/style-core.css?v=202608242140" />
  <link rel="icon" href="assets/images/avatar.jpg" />
  <noscript><style>.page-home .site-header,.page-home .profile-avatar,.page-home .profile-name,.page-home .profile-roman,.page-home .profile-sign,.page-home .social-row,.page-home .intro-panel,.page-home .home-tool-entries,.page-home .site-log,.page-home .home-cards,.page-home .site-footer{opacity:1!important}</style></noscript>
</head>
<body class="page-home" data-kaya-page="home">
  <div class="site-bg" aria-hidden="true"></div>

  <div class="home-intro" id="home-intro" aria-hidden="true">
    <canvas class="home-intro__rain" id="intro-rain"></canvas>
    <div class="home-intro__mist"></div>
    <div class="home-intro__grain"></div>
    <div class="home-intro__stage">
      <div class="home-intro__wrap">
        <canvas class="home-intro__liquid" id="intro-liquid" role="img" aria-label="ShigureKaya"></canvas>
      </div>
      <span class="home-intro__rule"></span>
    </div>
  </div>

  <header class="site-header">
    <div class="site-bar">
      <a href="/" class="brand">时雨榧</a>
      <button type="button" class="menu-toggle" id="menu-toggle" aria-label="菜单" aria-expanded="false">
        <span></span><span></span>
      </button>
      <nav>
        <ul class="site-nav" id="site-nav">
          <li><a href="/" class="active">主页</a></li>
          <li><a href="/works/">作品</a></li>
          <li><a href="/links/">链接</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="home-main">
    <section class="profile-hero">
      <div class="profile-avatar">
        <img id="hero-avatar" class="avatar" src="assets/images/avatar.jpg" alt="时雨榧" width="128" height="128" fetchpriority="high" decoding="async" />
      </div>
      <h1 class="profile-name" id="hero-name">时雨榧</h1>
      <p class="profile-roman">ShigureKaya</p>
      <p class="profile-sign" id="hero-sign">实现愿望程度的能力</p>
      <nav class="social-row" id="social-icons" aria-label="外部链接"></nav>
    </section>

    <section class="intro-panel" aria-label="简介">
      <div class="intro-panel__body" id="intro-body"></div>
    </section>

    <div class="home-tool-entries" aria-label="Gal 工具">
      <a href="/gal-quiz/" class="site-quiz-entry" aria-label="Gal 水平测试">
        <span class="site-quiz-entry__label">Quiz</span>
        <span class="site-quiz-entry__title">gal水平测试</span>
        <span class="site-quiz-entry__arrow" aria-hidden="true">→</span>
      </a>
      <a href="/gal-sedai/" class="site-quiz-entry" aria-label="Gal 世代">
        <span class="site-quiz-entry__label">Sedai</span>
        <span class="site-quiz-entry__title">Gal世代</span>
        <span class="site-quiz-entry__arrow" aria-hidden="true">→</span>
      </a>
    </div>

    <aside class="site-log" aria-label="站点日志">
      <div class="site-log__inner">
        <span class="site-log__tag">LOG</span>
        <p class="site-log__text">因本人在2026年8月20日被突然的暴雨淋了五分钟（一条不可挡雨的路），以水鬼姿态进入地铁，故增加了暴雨页面<br>经本人亲身证明，即使人在滴水，地铁安检员也会放你进去</p>
        <div class="site-log__action">
          <a href="/?rain=storm" class="site-log__btn">暴雨页面</a>
          <p class="site-log__hint">对电脑性能极其自信再点击</p>
        </div>
      </div>
    </aside>

    <section class="home-cards" aria-label="快捷入口">
      <a href="/works/" class="home-card">
        <span class="home-card__label">Portfolio</span>
        <span class="home-card__title">作品集</span>
        <span class="home-card__desc">视频与投稿列表</span>
        <span class="home-card__arrow" aria-hidden="true">→</span>
      </a>
      <a href="/mv-materials/" class="home-card home-card--mv">
        <span class="home-card__label">MV Assets</span>
        <span class="home-card__title">部分 MV 素材</span>
        <span class="home-card__desc">立绘与分镜素材预览</span>
        <div class="home-card__preview" id="mv-preview" aria-hidden="true"></div>
        <span class="home-card__arrow" aria-hidden="true">→</span>
      </a>
    </section>
  </main>

  <footer class="site-footer">
    <button type="button" class="footer-sites" id="footer-sites-open" aria-haspopup="dialog" aria-controls="footer-sites-dialog">
      前往其它页面
    </button>
    <p>© <span id="year"></span> 时雨榧</p>
    <p class="site-footer__motto">放弃幻想，开始战斗</p>
  </footer>

  <dialog class="footer-sites-dialog" id="footer-sites-dialog" aria-label="前往其它页面">
    <div class="footer-sites-dialog__panel">
      <header class="footer-sites-dialog__head">
        <p class="footer-sites-dialog__title">前往其它页面</p>
        <button type="button" class="footer-sites-dialog__close" id="footer-sites-close" aria-label="关闭">×</button>
      </header>
      <nav class="footer-sites-list" aria-label="站点列表">
        <a class="footer-sites-item" href="/fuyuu/">
          <img class="footer-sites-item__avatar" src="/fuyuu/assets/images/avatar.jpg" alt="" width="44" height="44" loading="lazy" decoding="async" />
          <span class="footer-sites-item__text">
            <strong>浮游Lev</strong>
            <small>Galgame 同人插画与绘画过程</small>
          </span>
          <span class="footer-sites-item__arrow" aria-hidden="true">→</span>
        </a>
        <button type="button" class="footer-sites-item is-wip" data-wip-msg="暂未完成（懒得做）">
          <img class="footer-sites-item__avatar" src="/assets/images/koharu-avatar.jpg" alt="" width="44" height="44" loading="lazy" decoding="async" />
          <span class="footer-sites-item__text">
            <strong>小春日向</strong>
            <small>Gal 同人插画与绘画过程</small>
          </span>
          <span class="footer-sites-item__arrow" aria-hidden="true">···</span>
        </button>
        <button type="button" class="footer-sites-item is-wip" data-wip-msg="暂未完成（懒得做）">
          <img class="footer-sites-item__avatar" src="/assets/images/shiotsuki-avatar.jpg" alt="" width="44" height="44" loading="lazy" decoding="async" />
          <span class="footer-sites-item__text">
            <strong>汐月空_poi</strong>
            <small>喜欢画画！喜欢gal！</small>
          </span>
          <span class="footer-sites-item__arrow" aria-hidden="true">···</span>
        </button>
      </nav>
    </div>
    <div class="kaya-toast" id="kaya-toast" hidden aria-live="polite"></div>
  </dialog>

  <script src="js/kaya-rain-mode.js?v=202608251200" defer></script>
  <script src="js/kaya-boot.js?v=202608251200" defer></script>
</body>
</html>
