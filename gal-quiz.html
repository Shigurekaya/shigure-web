<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/" />
  <title>Gal 水平测试</title>
  <meta name="description" content="Gal 水平测试 — 题目改编自 ima-ero エロゲクイズ" />
  <meta name="theme-color" content="#1a1030" />
  <link rel="stylesheet" href="css/style-core.css?v=202608252320" />
  <link rel="stylesheet" href="css/gal-quiz.css?v=202608252420" />
  <link rel="icon" href="assets/images/avatar.jpg" />
</head>
<body class="page-quiz page-quiz--standalone page-quiz--flat-bg" data-kaya-page="quiz">
  <div class="site-bg quiz-stage-bg" aria-hidden="true">
    <span class="quiz-stage-bg__sky"></span>
    <span class="quiz-stage-bg__bokeh"></span>
    <span class="quiz-stage-bg__horizon"></span>
    <span class="quiz-stage-bg__grain"></span>
    <canvas class="quiz-stage-bg__float" id="quiz-bg-float" aria-hidden="true"></canvas>
  </div>

  <main class="page-main page-main--quiz">
    <p class="quiz-back">
      <a href="/">返回主页</a>
    </p>

    <header class="quiz-hero" id="quiz-hero">
      <p class="quiz-hero__label">Gal Quiz</p>
      <h1 class="quiz-hero__title">Gal 水平测试</h1>
      <p class="quiz-hero__sub">题库改编自 ima-ero「エロゲクイズ」第 1–5 弹</p>
      <ul class="quiz-hero__stats">
        <li><strong>116</strong> 题</li>
        <li><strong>5</strong> 弹</li>
        <li>图 / 音 / 视频</li>
      </ul>
    </header>

    <section class="quiz-panel" id="quiz-root" aria-live="polite">
      <div class="quiz-intro" id="quiz-intro">
        <p class="quiz-intro__lead">选择挑战路线，测试你的 Gal 知识储备。</p>
        <p class="quiz-intro__note">※ 含剧透与绅士向内容 · 音视频需手动播放</p>

        <div class="quiz-mode-actions">
          <button type="button" class="quiz-mode-card quiz-mode-card--primary" id="quiz-start-random">
            <span class="quiz-mode-card__num" aria-hidden="true">01</span>
            <span class="quiz-mode-card__body">
              <span class="quiz-mode-card__title">随机 20 题</span>
              <span class="quiz-mode-card__desc">每题 5 分 · 满分 100</span>
            </span>
            <span class="quiz-mode-card__go" aria-hidden="true">▸</span>
          </button>
          <button type="button" class="quiz-mode-card" id="quiz-start-full">
            <span class="quiz-mode-card__num" aria-hidden="true">02</span>
            <span class="quiz-mode-card__body">
              <span class="quiz-mode-card__title">全部测试</span>
              <span class="quiz-mode-card__desc">按正确率计分 · 满分 100</span>
            </span>
            <span class="quiz-mode-card__go" aria-hidden="true">▸</span>
          </button>
        </div>

        <p class="quiz-intro__hint">作答后点「下一题」继续 · 完成后可回顾错题</p>
      </div>

      <div class="quiz-play" id="quiz-play" hidden>
        <div class="quiz-nav-backdrop" id="quiz-nav-backdrop" hidden></div>
        <aside class="quiz-nav" id="quiz-nav" aria-label="题目导航">
          <div class="quiz-nav__head">
            <div class="quiz-nav__head-row">
              <p class="quiz-nav__title">题目</p>
              <button type="button" class="quiz-nav__close" id="quiz-nav-close" aria-label="关闭题目列表">
                <span aria-hidden="true">×</span>
              </button>
            </div>
            <p class="quiz-nav__count" id="quiz-nav-count" aria-live="polite">
              <span class="quiz-nav__count-done" id="quiz-nav-count-done">0</span>
              <span class="quiz-nav__count-sep">/</span>
              <span class="quiz-nav__count-total" id="quiz-nav-count-total">20</span>
              <span class="quiz-nav__count-label">已答</span>
            </p>
            <div class="quiz-nav__mini-bar" aria-hidden="true"><i id="quiz-nav-mini-fill"></i></div>
          </div>
          <ol class="quiz-nav__list" id="quiz-nav-list"></ol>
        </aside>
        <div class="quiz-play__main">
          <div class="quiz-play__toolbar">
            <button type="button" class="quiz-nav-toggle" id="quiz-nav-toggle" aria-expanded="false" aria-controls="quiz-nav">
              <span class="quiz-nav-toggle__icon" aria-hidden="true"></span>
              <span class="quiz-nav-toggle__text" id="quiz-nav-toggle-text">0/20</span>
            </button>
            <div class="quiz-progress">
              <span class="quiz-progress__label" id="quiz-progress-text">1 / 20</span>
              <div class="quiz-progress__track" aria-hidden="true"><i id="quiz-progress-fill"></i></div>
            </div>
          </div>
          <article class="quiz-card" id="quiz-card">
            <div class="quiz-dialogue">
              <header class="quiz-card__head">
                <span class="quiz-card__num" id="quiz-card-num">Q1</span>
                <span class="quiz-card__meta" id="quiz-meta"></span>
              </header>
              <h2 class="quiz-card__q" id="quiz-question"></h2>
            </div>
            <aside class="quiz-answer-debug" id="quiz-answer-debug" aria-label="临时参考答案"></aside>
            <div class="quiz-media" id="quiz-media"></div>
            <div class="quiz-answers" id="quiz-answers"></div>
            <p class="quiz-feedback" id="quiz-feedback" hidden></p>
            <div class="quiz-actions">
              <button type="button" class="quiz-btn" id="quiz-prev" hidden>上一题</button>
              <button type="button" class="quiz-btn quiz-btn--primary" id="quiz-next">下一题</button>
            </div>
          </article>
        </div>
      </div>

      <div class="quiz-result" id="quiz-result" hidden>
        <p class="quiz-result__eyebrow">Result</p>
        <p class="quiz-result__score"><span id="quiz-score">0</span><small id="quiz-score-max">/ 100</small></p>
        <p class="quiz-result__detail" id="quiz-result-detail"></p>
        <p class="quiz-result__rank" id="quiz-rank"></p>
        <div class="quiz-actions">
          <button type="button" class="quiz-btn quiz-btn--primary" id="quiz-retry">返回选模式</button>
          <a class="quiz-btn" href="/">返回主页</a>
        </div>
        <section class="quiz-review quiz-review--final" aria-label="答题回顾">
          <h3 class="quiz-review__title" id="quiz-review-title">答题回顾</h3>
          <p class="quiz-review__empty" id="quiz-review-empty" hidden>暂无答题记录。</p>
          <ol class="quiz-review-list" id="quiz-review-list"></ol>
        </section>
      </div>
    </section>
  </main>

  <footer class="site-footer site-footer--quiz">
    <p class="site-footer__credit">题目来源致谢：<a href="https://www.ima-ero.com/" target="_blank" rel="noopener noreferrer">今更だけどエロゲしようぜ！</a></p>
  </footer>

  <script src="js/kaya-rain-mode.js?v=202608252320" defer></script>
  <script src="js/kaya-boot.js?v=202608252420" defer></script>
</body>
</html>
