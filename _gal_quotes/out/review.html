<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gal 名言审阅</title>
  <style>
    :root {
      --bg: #f4f6fa;
      --panel: #fff;
      --line: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --accent: #3b82f6;
      --accent-soft: #dbeafe;
      --ok: #16a34a;
      --ok-soft: #dcfce7;
      --shadow: 0 8px 30px rgba(15, 23, 42, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 56rem;
      margin: 0 auto;
    }
    .main {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
      align-items: center;
      padding: .85rem 1rem;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .toolbar input, .toolbar select {
      padding: .45rem .65rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      background: #fff;
    }
    .toolbar input[type=search] { flex: 1; min-width: 12rem; }
    .toolbar-actions { display: flex; gap: .45rem; flex-wrap: wrap; }
    .stats { margin-left: auto; color: var(--muted); font-size: .85rem; }
    .list {
      overflow-y: auto;
      overflow-x: hidden;
      padding: .75rem 1rem 1.25rem;
      flex: 1;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
    }
    .item {
      display: flex;
      align-items: flex-start;
      gap: .75rem;
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 12px;
      padding: .75rem .9rem;
      margin-bottom: .55rem;
      transition: border-color .15s, background .15s;
    }
    .item:hover { border-color: #cbd5e1; }
    .item.is-approved { border-color: #86efac; background: linear-gradient(90deg, var(--ok-soft), var(--panel) 36%); }
    .item__check {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: .15rem;
      margin: 0;
    }
    .item__check input[type=checkbox] {
      width: 1.35rem;
      height: 1.35rem;
      accent-color: var(--ok);
      cursor: pointer;
    }
    .item__body {
      flex: 1;
      min-width: 0;
    }
    .item__zh { font-size: .95rem; line-height: 1.5; margin: 0 0 .35rem; }
    .item__orig { color: var(--muted); font-size: .82rem; margin: 0 0 .4rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .item__meta { font-size: .78rem; color: var(--muted); display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    .item__meta a { color: var(--accent); text-decoration: none; }
    .item__meta a:hover { text-decoration: underline; }
    .badge { background: #f1f5f9; padding: .1rem .45rem; border-radius: 999px; }
    .btn {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: .45rem .75rem;
      font: inherit;
      cursor: pointer;
    }
    .btn:hover { background: #f8fafc; }
    .btn--primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn--primary:hover { filter: brightness(1.05); }
    .toast {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: .5rem 1rem;
      border-radius: 999px;
      font-size: .85rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      z-index: 10;
    }
    .toast.is-on { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <section class="main">
      <div class="toolbar">
        <input type="search" id="q" placeholder="搜索台词 / 作品 / 角色…" autocomplete="off">
        <select id="filter">
          <option value="all">全部</option>
          <option value="pending">未审</option>
          <option value="approved">已保留</option>
          <option value="no-zh">缺中文</option>
        </select>
        <div class="toolbar-actions">
          <button type="button" class="btn" id="export-json">导出 approved.json</button>
          <button type="button" class="btn btn--primary" id="open-approved">已保留列表</button>
        </div>
        <span class="stats" id="stats"></span>
      </div>
      <div class="list" id="list"></div>
    </section>
  </div>
  <div class="toast" id="toast"></div>
  <script id="bootstrap" type="application/json">{"quotes": [{"id": "q3411", "quote": "You need to know Pain yourself to understand the Pain of others. That is why people who have not known Pain are able to hurt others so easily.", "quote_zh": "你需要了解自己的痛苦才能理解别人的痛苦。这就是为什么那些不知道痛苦的人能够如此轻易地伤害别人。", "quote_zh_source": "mt", "character": "Mamiya Takuji", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 26, "motto_rank": 43, "source": "VNDB", "source_url": "https://vndb.org/q3411", "vn_url": "https://vndb.org/v3144"}, {"id": "q3380", "quote": "Happiness that stretches into Eternity... Eternal Happiness is no different from Hell. No matter how Happy Life is, without a proper Ending, it is more like a Nightmare.", "quote_zh": "延伸到永恒的幸福……永恒的幸福与地狱没有什么不同。生活再幸福，没有适当的结局，就更像是一场噩梦。", "quote_zh_source": "mt", "character": "Mamiya Takuji", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 11, "motto_rank": 43, "source": "VNDB", "source_url": "https://vndb.org/q3380", "vn_url": "https://vndb.org/v3144"}, {"id": "q5411", "quote": "I am destiny. I am fate. I am the border between life and death. I am The End of All Things!", "quote_zh": "我就是命运。我就是命运。我是生与死的边界。我是万物的终结！", "quote_zh_source": "mt", "character": "", "vn_id": "v2016", "vn_title": "Soukou Akki Muramasa", "vn_title_zh": "装甲恶鬼村正", "score": 3, "motto_rank": 43, "source": "VNDB", "source_url": "https://vndb.org/q5411", "vn_url": "https://vndb.org/v2016"}, {"id": "q3627", "quote": "I would have been fine if I never knew what hope was. Then I never would have known despair either.", "quote_zh": "如果我从来不知道希望是什么，我会没事的。那么我也永远不会知道绝望。", "quote_zh_source": "mt", "character": "", "vn_id": "v7", "vn_title": "Tsukihime", "vn_title_zh": "月姬", "score": 21, "motto_rank": 37, "source": "VNDB", "source_url": "https://vndb.org/q3627", "vn_url": "https://vndb.org/v7"}, {"id": "q3641", "quote": "You can do a lot more things than you think yourself able, ergo you should live always facing forward.", "quote_zh": "你可以做的事情比你想象的要多得多，因此你应该永远面朝前方生活。", "quote_zh_source": "mt", "character": "Kurugaya Yuiko", "vn_id": "v5", "vn_title": "Little Busters!", "vn_title_zh": "Little Busters!", "score": 7, "motto_rank": 37, "source": "VNDB", "source_url": "https://vndb.org/q3641", "vn_url": "https://vndb.org/v5"}, {"id": "q8247", "quote": "There’s nothing wrong with trying to find relief by blaming yourself. But always remember that when you suffer, others suffer as well.", "quote_zh": "通过责备自己来寻求解脱并没有什么错。但永远记住，当你受苦时，其他人也会受苦。", "quote_zh_source": "mt", "character": "Sakiyama Kenzou", "vn_id": "v94", "vn_title": "Kimi ga Nozomu Eien", "vn_title_zh": "君が望む永遠", "score": 3, "motto_rank": 37, "source": "VNDB", "source_url": "https://vndb.org/q8247", "vn_url": "https://vndb.org/v94"}, {"id": "q223", "quote": "That's right...We were always together...In this world. In this sad, lonely world", "quote_zh": "没错……我们一直在一起……在这个世界上。在这个悲伤、孤独的世界里", "quote_zh_source": "mt", "character": "", "vn_id": "v4", "vn_title": "CLANNAD", "vn_title_zh": "CLANNAD", "score": 20, "motto_rank": 36, "source": "VNDB", "source_url": "https://vndb.org/q223", "vn_url": "https://vndb.org/v4"}, {"id": "q4118", "quote": "Even if one must die to protect another... there is a considerable difference between accepting that as the fate bestowed on you, and choosing it of your own free will.", "quote_zh": "即使一个人必须为了保护另一个人而死……接受命运赋予你的这一点与你自己自由意志的选择之间存在着相当大的区别。", "quote_zh_source": "mt", "character": "Mitsurugi Meiya", "vn_id": "v92", "vn_title": "Muv-Luv Alternative", "vn_title_zh": "Muv-Luv Alternative", "score": 14, "motto_rank": 35, "source": "VNDB", "source_url": "https://vndb.org/q4118", "vn_url": "https://vndb.org/v92"}, {"id": "q3458", "quote": "He Understood... He said that his Life was Most Beautiful in that World where he could Die at Any Second.", "quote_zh": "他明白了……他说，在那个随时可能死去的世界里，他的生命是最美丽的。", "quote_zh_source": "mt", "character": "Mamiya Takuji", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 4, "motto_rank": 35, "source": "VNDB", "source_url": "https://vndb.org/q3458", "vn_url": "https://vndb.org/v3144"}, {"id": "q5413", "quote": "No matter! I do not wish for eternity! Give me one moment. One moment of pure, unsullied truth… and my life will have had meaning!", "quote_zh": "不管！我不希望永恒！给我一点时间。只要有一刻纯净、无玷污的真理……我的人生就会变得有意义！", "quote_zh_source": "mt", "character": "Minato Hikaru", "vn_id": "v2016", "vn_title": "Soukou Akki Muramasa", "vn_title_zh": "装甲恶鬼村正", "score": 14, "motto_rank": 34, "source": "VNDB", "source_url": "https://vndb.org/q5413", "vn_url": "https://vndb.org/v2016"}, {"id": "q5325", "quote": "\"An artwork is something seen under the aspect of eternity. And a good life is a world seen under the aspect of eternity. That’s where art and ethics connect.\"", "quote_zh": "“艺术品是在永恒的角度下看到的东西。美好的生活是在永恒的角度下看到的世界。这就是艺术与伦理的联系。”", "quote_zh_source": "mt", "character": "Kusanagi Naoya", "vn_id": "v562", "vn_title": "Sakura no Uta -Sakura no Mori no Ue o Mau-", "vn_title_zh": "サクラノ詩－櫻の森の上を舞う－", "score": 9, "motto_rank": 34, "source": "VNDB", "source_url": "https://vndb.org/q5325", "vn_url": "https://vndb.org/v562"}, {"id": "q3392", "quote": "If I wish it, I Exist. For in the midst of this White World I Remembered Everything.", "quote_zh": "如果我愿意，我就存在。因为在这个白色的世界里我记住了一切。", "quote_zh_source": "mt", "character": "", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 3, "motto_rank": 34, "source": "VNDB", "source_url": "https://vndb.org/q3392", "vn_url": "https://vndb.org/v3144"}, {"id": "q1607", "quote": "I am a fool, and folly is my nature. If the wise path brings only regret, then I'll give myself to madness and laugh all the way to hell", "quote_zh": "我是个傻瓜，愚蠢是我的本性。如果明智的道路只带来遗憾，那么我就会陷入疯狂，一路笑到地狱", "quote_zh_source": "mt", "character": "", "vn_id": "v2016", "vn_title": "Soukou Akki Muramasa", "vn_title_zh": "装甲恶鬼村正", "score": 16, "motto_rank": 33, "source": "VNDB", "source_url": "https://vndb.org/q1607", "vn_url": "https://vndb.org/v2016"}, {"id": "q5597", "quote": "I was born with nothing. I will die with nothing!", "quote_zh": "我生来一无所有。我会一无所有地死去！", "quote_zh_source": "mt", "character": "Ushiromiya Kinzou", "vn_id": "v24", "vn_title": "Umineko no Naku Koro ni", "vn_title_zh": "海猫鸣泣之时", "score": 14, "motto_rank": 32, "source": "VNDB", "source_url": "https://vndb.org/q5597", "vn_url": "https://vndb.org/v24"}, {"id": "q6033", "quote": "I hope that our tomorrow is overflowing with happy light, forever and ever......", "quote_zh": "希望我们的明天洋溢着幸福的光芒，永远永远……", "quote_zh_source": "mt", "character": "Nikaidou Shinku", "vn_id": "v10028", "vn_title": "Irotoridori no Hikari", "vn_title_zh": "", "score": 14, "motto_rank": 32, "source": "VNDB", "source_url": "https://vndb.org/q6033", "vn_url": "https://vndb.org/v10028"}, {"id": "q255", "quote": "I believe someone with your talent only comes around once every six months or so.", "quote_zh": "我相信像你这样有才华的人大约每六个月才会出现一次。", "quote_zh_source": "mt", "character": "Ureshino Sayumi", "vn_id": "v8158", "vn_title": "Daitoshokan no Hitsujikai", "vn_title_zh": "大図書館の羊飼い", "score": 6, "motto_rank": 32, "source": "VNDB", "source_url": "https://vndb.org/q255", "vn_url": "https://vndb.org/v8158"}, {"id": "q9062", "quote": "The world contains everything—and yet, I do not belong to it. And precisely because of that, I am able to discover the purpose and meaning of 'living.'", "quote_zh": "世界包含了一切——然而，我却不属于它。正因为如此，我才能够发现“活着”的目的和意义。", "quote_zh_source": "mt", "character": "Kusanagi Ken'ichirou", "vn_id": "v20431", "vn_title": "Sakura no Toki -Sakura no Mori no Shita o Ayumu-", "vn_title_zh": "サクラノ刻－櫻の森の下を歩む－", "score": 6, "motto_rank": 32, "source": "VNDB", "source_url": "https://vndb.org/q9062", "vn_url": "https://vndb.org/v20431"}, {"id": "q3346", "quote": "That's right. It's a Dream. I don't know how long I've been sleeping, but... It's a Dream. So... It Will End...", "quote_zh": "这是正确的。这是一个梦。我不知道自己睡了多久，但是……这是一个梦。所以……一切都会结束……", "quote_zh_source": "mt", "character": "Mamiya Takuji", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 4, "motto_rank": 32, "source": "VNDB", "source_url": "https://vndb.org/q3346", "vn_url": "https://vndb.org/v3144"}, {"id": "q3434", "quote": "This World is destined to The End, and to replace it, a New Turn will occur. This is the Infallible Truth.", "quote_zh": "这个世界注定会走向终结，而取代它的，将是新的转折。这是无误的真理。", "quote_zh_source": "mt", "character": "Mamiya Takuji", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 5, "motto_rank": 31, "source": "VNDB", "source_url": "https://vndb.org/q3434", "vn_url": "https://vndb.org/v3144"}, {"id": "q7353", "quote": "Memories are always the same color as the sky, just out of reach. An epheremal, endlessly transparent blue.", "quote_zh": "回忆总是和天空一样的颜色，只是遥不可及。转瞬即逝、无尽透明的蓝色。", "quote_zh_source": "mt", "character": "Toono Minagi", "vn_id": "v36", "vn_title": "AIR", "vn_title_zh": "AIR", "score": 2, "motto_rank": 31, "source": "VNDB", "source_url": "https://vndb.org/q7353", "vn_url": "https://vndb.org/v36"}, {"id": "q7460", "quote": "Even when we despise it (the world), we still love to despise it, for we still live to despise it, which is tantamount to loving it because it's still to live in it.", "quote_zh": "即使我们鄙视它（世界），我们仍然喜欢鄙视它，因为我们仍然活着鄙视它，这等于爱它，因为它仍然生活在其中。", "quote_zh_source": "mt", "character": "Doctor", "vn_id": "v61829", "vn_title": "My Last War", "vn_title_zh": "", "score": 1, "motto_rank": 31, "source": "VNDB", "source_url": "https://vndb.org/q7460", "vn_url": "https://vndb.org/v61829"}, {"id": "q7941", "quote": "That's not true. I love Sakaki from the depths of my heart... my concern for her future is only slightly overweighed by my concern for the crawfish in Amane's room.", "quote_zh": "那不是真的。我从心底里爱着榊……我对她未来的关心只比我对天音房间里的小龙虾的关心稍稍重要一些。", "quote_zh_source": "mt", "character": "Kazami Yuuji", "vn_id": "v7723", "vn_title": "Grisaia no Meikyuu -LE LABYRINTHE DE LA GRISAIA-", "vn_title_zh": "グリザイアの迷宮 -LE LABYRINTHE DE LA GRISAIA-", "score": 1, "motto_rank": 31, "source": "VNDB", "source_url": "https://vndb.org/q7941", "vn_url": "https://vndb.org/v7723"}, {"id": "q4034", "quote": "Mistress, sleeping on the roadside is inconsiderate to pedestrians. Please rest in that garbage bin over there. I believe tomorrow is collection day.", "quote_zh": "太太，睡在路边是不体谅行人的行为。请在那边的垃圾桶里休息。我相信明天就是收集日。", "quote_zh_source": "mt", "character": "Nagakura Sayo", "vn_id": "v2016", "vn_title": "Soukou Akki Muramasa", "vn_title_zh": "装甲恶鬼村正", "score": 26, "motto_rank": 30, "source": "VNDB", "source_url": "https://vndb.org/q4034", "vn_url": "https://vndb.org/v2016"}, {"id": "q2384", "quote": "This must be a dream. You'd never say anything this retarded in real life...", "quote_zh": "这一定是一个梦。现实生活中你绝对不会说出这么迟钝的话……", "quote_zh_source": "mt", "character": "Inohara Masato", "vn_id": "v5", "vn_title": "Little Busters!", "vn_title_zh": "Little Busters!", "score": 14, "motto_rank": 30, "source": "VNDB", "source_url": "https://vndb.org/q2384", "vn_url": "https://vndb.org/v5"}, {"id": "q3971", "quote": "It's a white void, with shifting lines of binary as far as the eye can see. It's nothing and everything at the same time. My beginning and my end.", "quote_zh": "这是一片白色的虚空，肉眼所见处都有移动的双星线。它什么都不是，同时又是一切。我的开始和我的结束。", "quote_zh_source": "mt", "character": "Ai", "vn_id": "v53835", "vn_title": "Love Angel Syndrome", "vn_title_zh": "", "score": 8, "motto_rank": 30, "source": "VNDB", "source_url": "https://vndb.org/q3971", "vn_url": "https://vndb.org/v53835"}, {"id": "q4705", "quote": "When they see her sobbing, they'll probably laugh at her. Let them; it would be the happiest moment of her life. She just wants this torment to end.", "quote_zh": "当他们看到她哭泣时，他们可能会嘲笑她。让他们；这将是她一生中最幸福的时刻。她只想结束这种折磨。", "quote_zh_source": "mt", "character": "", "vn_id": "v97", "vn_title": "Saya no Uta", "vn_title_zh": "沙耶之歌", "score": 7, "motto_rank": 30, "source": "VNDB", "source_url": "https://vndb.org/q4705", "vn_url": "https://vndb.org/v97"}, {"id": "q2149", "quote": "\"A dream you dream alone is only a dream. A dream you dream together is reality.\"", "quote_zh": "“一个人的梦想只是梦想，一起做的梦想才是现实。”", "quote_zh_source": "mt", "character": "", "vn_id": "v18814", "vn_title": "Seireki 2236-nen", "vn_title_zh": "西暦2236年", "score": 6, "motto_rank": 30, "source": "VNDB", "source_url": "https://vndb.org/q2149", "vn_url": "https://vndb.org/v18814"}, {"id": "q8981", "quote": "Underpants are the soul of a girl. You shouldn't peek at someone else's soul.", "quote_zh": "内裤是女孩的灵魂。你不应该窥视别人的灵魂。", "quote_zh_source": "mt", "character": "Rin Tezuka", "vn_id": "v945", "vn_title": "Katawa Shoujo", "vn_title_zh": "片羽少女", "score": 6, "motto_rank": 30, "source": "VNDB", "source_url": "https://vndb.org/q8981", "vn_url": "https://vndb.org/v945"}, {"id": "q7134", "quote": "Tell the story to all who will listen. To all the people who live in this beautiful world. Tell them once upon a time... There was a girl who dreamed the world.", "quote_zh": "把这个故事讲给所有愿意听的人听。致所有生活在这个美丽世界的人们。告诉他们从前……有一个女孩梦想着这个世界。", "quote_zh_source": "mt", "character": "Kaito", "vn_id": "v26987", "vn_title": "Hakuchuumu no Aojashin", "vn_title_zh": "白昼夢の青写真", "score": 4, "motto_rank": 30, "source": "VNDB", "source_url": "https://vndb.org/q7134", "vn_url": "https://vndb.org/v26987"}, {"id": "q9107", "quote": "Both landscape and music are in flow. The world and music flow in the same current. And so, I think this world is a kind of poetry. It’s a rock and roll world.", "quote_zh": "风景和音乐都在流动。世界和音乐同流同流。所以，我觉得这个世界是一种诗。这是一个摇滚世界。", "quote_zh_source": "mt", "character": "Natsume Kei", "vn_id": "v20431", "vn_title": "Sakura no Toki -Sakura no Mori no Shita o Ayumu-", "vn_title_zh": "サクラノ刻－櫻の森の下を歩む－", "score": 4, "motto_rank": 30, "source": "VNDB", "source_url": "https://vndb.org/q9107", "vn_url": "https://vndb.org/v20431"}, {"id": "q3424", "quote": "I will not be able to see it... What, pray tell, is the ability to see the Being preceding the Being? What feelings can one hope for before Existence?", "quote_zh": "我将无法看到它……请告诉我，什么是看到先于存在的存在的能力？在存在之前，一个人可以期待什么感觉？", "quote_zh_source": "mt", "character": "", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 2, "motto_rank": 30, "source": "VNDB", "source_url": "https://vndb.org/q3424", "vn_url": "https://vndb.org/v3144"}, {"id": "q8207", "quote": "There comes a time when you meet someone somewhere and you come to think it was all a process meant to prepare you to be of help to that person.", "quote_zh": "有时候，当你在某个地方遇到某人时，你开始认为这一切都是为了让你做好准备帮助那个人的过程。", "quote_zh_source": "mt", "character": "Takahara Hairi", "vn_id": "v20424", "vn_title": "Summer Pockets", "vn_title_zh": "", "score": 1, "motto_rank": 30, "source": "VNDB", "source_url": "https://vndb.org/q8207", "vn_url": "https://vndb.org/v20424"}, {"id": "q4353", "quote": "I can make your bentos. I'll make them every day, and fill them with love.", "quote_zh": "我可以给你做便当。我会每天都做它们，并让它们充满爱。", "quote_zh_source": "mt", "character": "Sakagami Tomoyo", "vn_id": "v4", "vn_title": "CLANNAD", "vn_title_zh": "CLANNAD", "score": -3, "motto_rank": 30, "source": "VNDB", "source_url": "https://vndb.org/q4353", "vn_url": "https://vndb.org/v4"}, {"id": "q3868", "quote": "I don't want to deny who I've been. Because even my failures are a part of who I am today.", "quote_zh": "我不想否认我曾经是谁。因为即使是我的失败也是我今天的一部分。", "quote_zh_source": "mt", "character": "Makise Kurisu", "vn_id": "v2002", "vn_title": "STEINS;GATE", "vn_title_zh": "命运石之门", "score": 25, "motto_rank": 29, "source": "VNDB", "source_url": "https://vndb.org/q3868", "vn_url": "https://vndb.org/v2002"}, {"id": "q3389", "quote": "How many Souls does it take to make a World? How many Souls does it take to make it a World... Apparently, only One is enough.", "quote_zh": "创造一个世界需要多少灵魂？需要多少灵魂才能成为一个世界……显然，只要一个就足够了。", "quote_zh_source": "mt", "character": "", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 8, "motto_rank": 29, "source": "VNDB", "source_url": "https://vndb.org/q3389", "vn_url": "https://vndb.org/v3144"}, {"id": "q3306", "quote": "I don't have time to waste on irresponsible brats who wanna know every little detail about adult problems they couldn't possibly help solve", "quote_zh": "我没有时间浪费在那些不负责任的孩子身上，他们想知道他们无法帮助解决的成人问题的每一个细节", "quote_zh_source": "mt", "character": "Kouzuki Yuuko", "vn_id": "v92", "vn_title": "Muv-Luv Alternative", "vn_title_zh": "Muv-Luv Alternative", "score": 6, "motto_rank": 29, "source": "VNDB", "source_url": "https://vndb.org/q3306", "vn_url": "https://vndb.org/v92"}, {"id": "q8249", "quote": "I can't believe you’re shameless enough to think it’s okay to show your dumbass face in public.", "quote_zh": "我不敢相信你竟然厚颜无耻到认为可以在公共场合露出你的蠢脸。", "quote_zh_source": "mt", "character": "Daikuuji Ayu", "vn_id": "v94", "vn_title": "Kimi ga Nozomu Eien", "vn_title_zh": "君が望む永遠", "score": 6, "motto_rank": 29, "source": "VNDB", "source_url": "https://vndb.org/q8249", "vn_url": "https://vndb.org/v94"}, {"id": "q8203", "quote": "I always love it when girls fall in love with me, nya!", "quote_zh": "我总是喜欢女孩们爱上我，nya！", "quote_zh_source": "mt", "character": "Akiha Rumiho", "vn_id": "v17102", "vn_title": "STEINS;GATE 0", "vn_title_zh": "", "score": 1, "motto_rank": 29, "source": "VNDB", "source_url": "https://vndb.org/q8203", "vn_url": "https://vndb.org/v17102"}, {"id": "q199", "quote": "Of course. I'm certain of it, because I write everything I know about Azai-kun in my diary.", "quote_zh": "当然。我很确定，因为我把我所知道的关于浅井君的一切都写在了日记里。", "quote_zh_source": "mt", "character": "", "vn_id": "v211", "vn_title": "G-senjou no Maou", "vn_title_zh": "G線上の魔王", "score": -2, "motto_rank": 29, "source": "VNDB", "source_url": "https://vndb.org/q199", "vn_url": "https://vndb.org/v211"}, {"id": "q4724", "quote": "I have nothing against homosexuals. But unfortunately, I am heterosexual.", "quote_zh": "我对同性恋者没有任何反对意见。但不幸的是，我是异性恋。", "quote_zh_source": "mt", "character": "", "vn_id": "v2002", "vn_title": "STEINS;GATE", "vn_title_zh": "命运石之门", "score": 18, "motto_rank": 28, "source": "VNDB", "source_url": "https://vndb.org/q4724", "vn_url": "https://vndb.org/v2002"}, {"id": "q3331", "quote": "God is not able to save the World. Angels are not able to save the World. If God does not do this, then People will do it.", "quote_zh": "上帝无法拯救世界。天使无法拯救世界。如果上帝不这样做，人们就会这样做。", "quote_zh_source": "mt", "character": "Mamiya Takuji", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 12, "motto_rank": 28, "source": "VNDB", "source_url": "https://vndb.org/q3331", "vn_url": "https://vndb.org/v3144"}, {"id": "q4340", "quote": "I can see... the light at the end of nudity's tunnel!", "quote_zh": "我可以看到……裸体隧道尽头的曙光！", "quote_zh_source": "mt", "character": "Mitani Ryouichi", "vn_id": "v20424", "vn_title": "Summer Pockets", "vn_title_zh": "", "score": 6, "motto_rank": 28, "source": "VNDB", "source_url": "https://vndb.org/q4340", "vn_url": "https://vndb.org/v20424"}, {"id": "q5083", "quote": "I can't believe you! You can kiss my route goodbye!", "quote_zh": "我不敢相信你！你可以和我的路线吻别了！", "quote_zh_source": "mt", "character": "Pani", "vn_id": "v751", "vn_title": "Rewrite", "vn_title_zh": "Rewrite", "score": 6, "motto_rank": 28, "source": "VNDB", "source_url": "https://vndb.org/q5083", "vn_url": "https://vndb.org/v751"}, {"id": "q5815", "quote": "In the world of adults, it's more important to show that you're dealing with a problem than to actually solve it.", "quote_zh": "在成人的世界中，表明你正在处理问题比实际解决问题更重要。", "quote_zh_source": "mt", "character": "Senri Akane", "vn_id": "v751", "vn_title": "Rewrite", "vn_title_zh": "Rewrite", "score": 5, "motto_rank": 28, "source": "VNDB", "source_url": "https://vndb.org/q5815", "vn_url": "https://vndb.org/v751"}, {"id": "q870", "quote": "I was in a dark forest, being chased by a scary man with scissors. It was horrible.", "quote_zh": "我在一片黑暗的森林里，被一个拿着剪刀的可怕男人追赶。太可怕了。", "quote_zh_source": "mt", "character": "Kanbe Kotori", "vn_id": "v751", "vn_title": "Rewrite", "vn_title_zh": "Rewrite", "score": 4, "motto_rank": 28, "source": "VNDB", "source_url": "https://vndb.org/q870", "vn_url": "https://vndb.org/v751"}, {"id": "q3336", "quote": "People who can't decide for themselves can be said to never die, but only because they never live in the first place.", "quote_zh": "不能为自己做决定的人可以说永远不会死，但这只是因为他们从一开始就没有活过。", "quote_zh_source": "mt", "character": "", "vn_id": "v18852", "vn_title": "Amatsutsumi", "vn_title_zh": "天津罪", "score": 4, "motto_rank": 28, "source": "VNDB", "source_url": "https://vndb.org/q3336", "vn_url": "https://vndb.org/v18852"}, {"id": "q3457", "quote": "It's either the Stars or the Snow that are Falling... Does it Really Matter on The End?", "quote_zh": "落下的要么是星星，要么是雪……最后真的很重要吗？", "quote_zh_source": "mt", "character": "Mamiya Takuji", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 4, "motto_rank": 28, "source": "VNDB", "source_url": "https://vndb.org/q3457", "vn_url": "https://vndb.org/v3144"}, {"id": "q7285", "quote": "I cannot help but yearn for a past like that: even one which involves throwing partially dissected frogs at classmates from across the biology classroom.", "quote_zh": "我情不自禁地向往那样的过去：即使是向生物教室另一边的同学扔部分解剖的青蛙。", "quote_zh_source": "mt", "character": "", "vn_id": "v47348", "vn_title": "In Fair Spirits", "vn_title_zh": "", "score": 4, "motto_rank": 28, "source": "VNDB", "source_url": "https://vndb.org/q7285", "vn_url": "https://vndb.org/v47348"}, {"id": "q7889", "quote": "I feel like there's another me up in the sky... I feel I'm sure about it.", "quote_zh": "我感觉天空中还有另一个我……我感觉我对此很确定。", "quote_zh_source": "mt", "character": "Kamio Misuzu", "vn_id": "v36", "vn_title": "AIR", "vn_title_zh": "AIR", "score": 4, "motto_rank": 28, "source": "VNDB", "source_url": "https://vndb.org/q7889", "vn_url": "https://vndb.org/v36"}, {"id": "q8277", "quote": "I'm going to live the rest of my life as 'Poopy Colin Masato,' looking for coins left in vending machines...", "quote_zh": "我将作为“便便科林正人”度过余生，寻找自动售货机中剩下的硬币......", "quote_zh_source": "mt", "character": "Inohara Masato", "vn_id": "v5", "vn_title": "Little Busters!", "vn_title_zh": "Little Busters!", "score": 3, "motto_rank": 28, "source": "VNDB", "source_url": "https://vndb.org/q8277", "vn_url": "https://vndb.org/v5"}, {"id": "q3408", "quote": "Please look at the Cross among the Stars — Will you remember Yourself in it?", "quote_zh": "请看星星之间的十字架——你会记得里面的自己吗？", "quote_zh_source": "mt", "character": "", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 2, "motto_rank": 28, "source": "VNDB", "source_url": "https://vndb.org/q3408", "vn_url": "https://vndb.org/v3144"}, {"id": "q3913", "quote": "Happy birthday to you. Happy birthday dear Shinichi. Happy birthday to you!", "quote_zh": "祝你生日快乐。亲爱的新一，生日快乐。祝你生日快乐！", "quote_zh_source": "mt", "character": "Sone Miyuki", "vn_id": "v7738", "vn_title": "Kimi to Kanojo to Kanojo no Koi.", "vn_title_zh": "君と彼女と彼女の恋。", "score": 2, "motto_rank": 28, "source": "VNDB", "source_url": "https://vndb.org/q3913", "vn_url": "https://vndb.org/v7738"}, {"id": "q7895", "quote": "It's called a miracle, because it will never happen.", "quote_zh": "这被称为奇迹，因为它永远不会发生。", "quote_zh_source": "mt", "character": "Misaka Shiori", "vn_id": "v33", "vn_title": "Kanon", "vn_title_zh": "Kanon", "score": 2, "motto_rank": 28, "source": "VNDB", "source_url": "https://vndb.org/q7895", "vn_url": "https://vndb.org/v33"}, {"id": "q8982", "quote": "So artists can't find romance, their favorite TV shows are cancelled, or they die young because of an unspecified disease.", "quote_zh": "因此，艺术家们找不到浪漫，他们最喜欢的电视节目被取消，或者他们因不明疾病而英年早逝。", "quote_zh_source": "mt", "character": "Rin Tezuka", "vn_id": "v945", "vn_title": "Katawa Shoujo", "vn_title_zh": "片羽少女", "score": 2, "motto_rank": 28, "source": "VNDB", "source_url": "https://vndb.org/q8982", "vn_url": "https://vndb.org/v945"}, {"id": "q4570", "quote": "Oh, but does it really matter how long you’ve known someone? Because in the end, you’re either compatible or you’re not.", "quote_zh": "哦，但是你认识某人多久真的很重要吗？因为最终，你们要么兼容，要么不兼容。", "quote_zh_source": "mt", "character": "Ellen Aice", "vn_id": "v4463", "vn_title": "Muv-Luv Unlimited: The Day After", "vn_title_zh": "", "score": 1, "motto_rank": 28, "source": "VNDB", "source_url": "https://vndb.org/q4570", "vn_url": "https://vndb.org/v4463"}, {"id": "q8193", "quote": "Truth, it is truth. Love is death, and death is love.", "quote_zh": "真理，就是真理。爱就是死，死就是爱。", "quote_zh_source": "mt", "character": "Lancer", "vn_id": "v7602", "vn_title": "Fate/EXTRA", "vn_title_zh": "", "score": 1, "motto_rank": 28, "source": "VNDB", "source_url": "https://vndb.org/q8193", "vn_url": "https://vndb.org/v7602"}, {"id": "q8333", "quote": "I don't know how to cope with a world where I can't take off my shirt freely.", "quote_zh": "我不知道如何应对一个无法自由脱掉衬衫的世界。", "quote_zh_source": "mt", "character": "Mitani Ryouichi", "vn_id": "v20424", "vn_title": "Summer Pockets", "vn_title_zh": "", "score": 1, "motto_rank": 28, "source": "VNDB", "source_url": "https://vndb.org/q8333", "vn_url": "https://vndb.org/v20424"}, {"id": "q8693", "quote": "I know everything. For instance, I know that your cunt smells like rotten fish right now.", "quote_zh": "我什么都知道。例如，我知道你的阴户现在闻起来像烂鱼。", "quote_zh_source": "mt", "character": "", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 1, "motto_rank": 28, "source": "VNDB", "source_url": "https://vndb.org/q8693", "vn_url": "https://vndb.org/v3144"}, {"id": "q8709", "quote": "I always wondered why you'd wear something that's so unreliable to hide your panties.", "quote_zh": "我一直想知道你为什么要穿这么不可靠的东西来隐藏你的内裤。", "quote_zh_source": "mt", "character": "Takahara Hairi", "vn_id": "v20424", "vn_title": "Summer Pockets", "vn_title_zh": "", "score": 1, "motto_rank": 28, "source": "VNDB", "source_url": "https://vndb.org/q8709", "vn_url": "https://vndb.org/v20424"}, {"id": "q6028", "quote": "If you gave up from the start, there would be no disappointment. If you turned our back, there wouldn't be any happy things, but also no painful things.", "quote_zh": "如果你从一开始就放弃了，就不会有失望。如果你背弃了我们，就没有什么快乐的事情，也没有什么痛苦的事情。", "quote_zh_source": "mt", "character": "", "vn_id": "v10", "vn_title": "narcissu", "vn_title_zh": "水仙", "score": -1, "motto_rank": 28, "source": "VNDB", "source_url": "https://vndb.org/q6028", "vn_url": "https://vndb.org/v10"}, {"id": "q9380", "quote": "Women are creatures who always ask questions, and yet almost never answer them.", "quote_zh": "女人是一种总是问问题却几乎从不回答的生物。", "quote_zh_source": "mt", "character": "Ushiromiya Batora", "vn_id": "v24", "vn_title": "Umineko no Naku Koro ni", "vn_title_zh": "海猫鸣泣之时", "score": -1, "motto_rank": 28, "source": "VNDB", "source_url": "https://vndb.org/q9380", "vn_url": "https://vndb.org/v24"}, {"id": "q4665", "quote": "The allowance which came to me as an orphan was not enough for the bare necessities of life. Somehow or other I would have to earn my own bread.", "quote_zh": "作为孤儿，我得到的零用钱根本不够维持生活。无论如何，我必须自己挣钱养家糊口。", "quote_zh_source": "mt", "character": "Sakisaka Fuminori", "vn_id": "v97", "vn_title": "Saya no Uta", "vn_title_zh": "沙耶之歌", "score": -14, "motto_rank": 28, "source": "VNDB", "source_url": "https://vndb.org/q4665", "vn_url": "https://vndb.org/v97"}, {"id": "q867", "quote": "The person I love, my family and my relatives, everyone, everyone!! I'll protect them.", "quote_zh": "我爱的人，我的家人，我的亲人，大家，大家！！我会保护他们。", "quote_zh_source": "mt", "character": "", "vn_id": "v24", "vn_title": "Umineko no Naku Koro ni", "vn_title_zh": "海猫鸣泣之时", "score": -22, "motto_rank": 28, "source": "VNDB", "source_url": "https://vndb.org/q867", "vn_url": "https://vndb.org/v24"}, {"id": "q2863", "quote": "Depending on how you approach the day we call tomorrow, the shape of the world could change greatly.", "quote_zh": "世界的面貌可能会发生巨大的变化，这取决于你如何迎接我们明天的到来。", "quote_zh_source": "mt", "character": "Takashima Zakuro", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 21, "motto_rank": 27, "source": "VNDB", "source_url": "https://vndb.org/q2863", "vn_url": "https://vndb.org/v3144"}, {"id": "q5323", "quote": "It’s not that its all bad. If it really were all bad, we wouldn’t be suffering. We suffer because its not all bad. We suffer because we still have something going for us.", "quote_zh": "这并不全是坏事。如果一切真的都很糟糕，我们就不会受苦了。我们受苦是因为这并不全是坏事。我们受苦是因为我们还有事情要做。", "quote_zh_source": "mt", "character": "Kusanagi Naoya", "vn_id": "v562", "vn_title": "Sakura no Uta -Sakura no Mori no Ue o Mau-", "vn_title_zh": "サクラノ詩－櫻の森の上を舞う－", "score": 18, "motto_rank": 27, "source": "VNDB", "source_url": "https://vndb.org/q5323", "vn_url": "https://vndb.org/v562"}, {"id": "q3390", "quote": "History Repeats Itself Twice. The first time - As a Tragedy. The second time - As a Farce.", "quote_zh": "历史会重演两次。第一次——作为一场悲剧。第二次——作为一场闹剧。", "quote_zh_source": "mt", "character": "", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 13, "motto_rank": 27, "source": "VNDB", "source_url": "https://vndb.org/q3390", "vn_url": "https://vndb.org/v3144"}, {"id": "q5734", "quote": "If this was some eroge, then you'd find out that I was just a vengeful spirit, and the real Yuki-san was actually living her life without a clue about what was happening.", "quote_zh": "如果这是某种色情游戏，那么你就会发现我只是一个复仇的灵魂，而真正的由希小姐实际上过着她的生活，对发生的事情一无所知。", "quote_zh_source": "mt", "character": "Minakami Yuki", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 13, "motto_rank": 27, "source": "VNDB", "source_url": "https://vndb.org/q5734", "vn_url": "https://vndb.org/v3144"}, {"id": "q456", "quote": "You could found a temple with the number of graves I'd dug for myself.", "quote_zh": "你可以找到一座寺庙，里面有我为自己挖的坟墓的数量。", "quote_zh_source": "mt", "character": "", "vn_id": "v50", "vn_title": "Fate/hollow ataraxia", "vn_title_zh": "Fate/hollow ataraxia", "score": 12, "motto_rank": 27, "source": "VNDB", "source_url": "https://vndb.org/q456", "vn_url": "https://vndb.org/v50"}, {"id": "q4591", "quote": "Sorry, sorry. It's not like I came here to bully you. Being rude is just part of my personality.", "quote_zh": "对不起，对不起。我不是来欺负你的。粗鲁只是我性格的一部分。", "quote_zh_source": "mt", "character": "Beatrice", "vn_id": "v24", "vn_title": "Umineko no Naku Koro ni", "vn_title_zh": "海猫鸣泣之时", "score": 12, "motto_rank": 27, "source": "VNDB", "source_url": "https://vndb.org/q4591", "vn_url": "https://vndb.org/v24"}, {"id": "q5412", "quote": "…You listening, big bro? Make no mistake. This is a curse. On you. On the world. My final act of revenge.", "quote_zh": "……你在听吗，大哥？别搞错了。这是一个诅咒。在你身上。论世界。我最后的复仇行动。", "quote_zh_source": "mt", "character": "Ashikaga Chachamaru", "vn_id": "v2016", "vn_title": "Soukou Akki Muramasa", "vn_title_zh": "装甲恶鬼村正", "score": 10, "motto_rank": 27, "source": "VNDB", "source_url": "https://vndb.org/q5412", "vn_url": "https://vndb.org/v2016"}, {"id": "q1707", "quote": "I'm... worshipping the sun! I prostrate myself toward the setting sun to thank it for blessing us with another day of light, and I pray that it will rise gain tomorrow.", "quote_zh": "我……崇拜太阳！我向夕阳俯伏，感谢它赐予我们又一个光明的日子，祈祷它明天能升起。", "quote_zh_source": "mt", "character": "Aoba Ryuusei", "vn_id": "v38430", "vn_title": "GINKA", "vn_title_zh": "", "score": 8, "motto_rank": 27, "source": "VNDB", "source_url": "https://vndb.org/q1707", "vn_url": "https://vndb.org/v38430"}, {"id": "q4971", "quote": "Until 13 people die, they can spend their time as they like. If that's too boring, then they can wonder about whether 6x9=42, or something!!", "quote_zh": "直到13个人死去，他们才能随心所欲地度过自己的时光。如果这太无聊了，那么他们可以想知道是否 6x9=42，或者其他什么！", "quote_zh_source": "mt", "character": "", "vn_id": "v24", "vn_title": "Umineko no Naku Koro ni", "vn_title_zh": "海猫鸣泣之时", "score": 7, "motto_rank": 27, "source": "VNDB", "source_url": "https://vndb.org/q4971", "vn_url": "https://vndb.org/v24"}, {"id": "q818", "quote": "You must never set foot in that place. If you value your life. You must not even imagine what lies hidden inside. If you value your life.", "quote_zh": "那个地方绝对不能踏足。如果你珍视自己的生命。你绝对想象不到里面隐藏着什么。如果你珍视自己的生命。", "quote_zh_source": "mt", "character": "", "vn_id": "v1027", "vn_title": "Shikkoku no Sharnoth ~What a beautiful tomorrow~", "vn_title_zh": "漆黒のシャルノス ～What a beautiful tomorrow～", "score": 6, "motto_rank": 27, "source": "VNDB", "source_url": "https://vndb.org/q818", "vn_url": "https://vndb.org/v1027"}, {"id": "q9103", "quote": "Sound and syllables—that is all I must not forget. Eternity and the moment are one and the same. To feel what flows is to stand still before that fact. So I keep carving.", "quote_zh": "声音和音节——这就是我不能忘记的一切。永恒和当下是一回事。要感受流动的事物，就必须在事实面前保持静止。所以我继续雕刻。", "quote_zh_source": "mt", "character": "Kusanagi Naoya", "vn_id": "v20431", "vn_title": "Sakura no Toki -Sakura no Mori no Shita o Ayumu-", "vn_title_zh": "サクラノ刻－櫻の森の下を歩む－", "score": 4, "motto_rank": 27, "source": "VNDB", "source_url": "https://vndb.org/q9103", "vn_url": "https://vndb.org/v20431"}, {"id": "q6871", "quote": "I can be older, younger, and even a childhood friend or a first-love older sister... I'm so amazing, even if I do say so myself.", "quote_zh": "我可以是年长的，可以是年轻的，甚至可以是青梅竹马，也可以是初恋姐姐……我自己都这么说，真是太厉害了。", "quote_zh_source": "mt", "character": "Ginko", "vn_id": "v3938", "vn_title": "Tasogare no Sinsemilla", "vn_title_zh": "黄昏のシンセミア", "score": 3, "motto_rank": 27, "source": "VNDB", "source_url": "https://vndb.org/q6871", "vn_url": "https://vndb.org/v3938"}, {"id": "q8554", "quote": "Right now. I am the one to protect you in this world, Caim. That alone brings meaning to my life.", "quote_zh": "现在。在这个世界上我是要保护你的人，凯姆。仅此一点就给我的生活带来了意义。", "quote_zh_source": "mt", "character": "Eustia Astraea", "vn_id": "v3770", "vn_title": "Aiyoku no Eustia", "vn_title_zh": "秽翼的尤斯蒂娅", "score": 3, "motto_rank": 27, "source": "VNDB", "source_url": "https://vndb.org/q8554", "vn_url": "https://vndb.org/v3770"}, {"id": "q3425", "quote": "It immediately becomes clear how great God tried when He collected us piece by piece. Amazing Spectacle. How Difficult it is to Create Life. Even with all the Components.", "quote_zh": "当神把我们一点一点地收集起来时，他的尝试是多么伟大，立刻就显而易见了。令人惊叹的奇观。创造生命是多么的困难。即使拥有所有组件。", "quote_zh_source": "mt", "character": "Mamiya Takuji", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 2, "motto_rank": 27, "source": "VNDB", "source_url": "https://vndb.org/q3425", "vn_url": "https://vndb.org/v3144"}, {"id": "q4424", "quote": "An ancient civilization before time, perpetual youth and longevity, Rip Van Winkle, 800-year-old nun, and Santa Claus... None of these exist!", "quote_zh": "远古文明、青春永驻、长寿、瑞普·凡·温克尔、800岁修女、圣诞老人……这些都不存在！", "quote_zh_source": "mt", "character": "Kuranari Takeshi", "vn_id": "v17", "vn_title": "Ever17 -the out of infinity-", "vn_title_zh": "永远的艾塞莉娅 DVD版", "score": 2, "motto_rank": 27, "source": "VNDB", "source_url": "https://vndb.org/q4424", "vn_url": "https://vndb.org/v17"}, {"id": "q3015", "quote": "I am symbols and I am strands of loose endings. Neurons firing a blinding light. I am neurons firing a blinding light. I am a blinding light.", "quote_zh": "我是符号，我是一缕缕松散的结局。神经元发出令人眼花缭乱的光芒。我是发出耀眼光芒的神经元。我是一道刺眼的光。", "quote_zh_source": "mt", "character": "", "vn_id": "v31544", "vn_title": "Dawn Chorus", "vn_title_zh": "", "score": 1, "motto_rank": 27, "source": "VNDB", "source_url": "https://vndb.org/q3015", "vn_url": "https://vndb.org/v31544"}, {"id": "q5906", "quote": "Once a human knows a possible path to their future, that somehow ensures that they never actually reach it.", "quote_zh": "一旦一个人知道了通往未来的可能道路，就会以某种方式确保他们永远不会真正到达它。", "quote_zh_source": "mt", "character": "Kodachi Nagi", "vn_id": "v8158", "vn_title": "Daitoshokan no Hitsujikai", "vn_title_zh": "大図書館の羊飼い", "score": 1, "motto_rank": 27, "source": "VNDB", "source_url": "https://vndb.org/q5906", "vn_url": "https://vndb.org/v8158"}, {"id": "q8184", "quote": "Hmmm... A need to prove your identity to play a mere game... It is a harsh world we live in...", "quote_zh": "嗯...需要证明你的身份才能玩一个纯粹的游戏...我们生活在一个严酷的世界...", "quote_zh_source": "mt", "character": "Mitsurugi Meiya", "vn_id": "v93", "vn_title": "Muv-Luv", "vn_title_zh": "Muv-Luv", "score": 1, "motto_rank": 27, "source": "VNDB", "source_url": "https://vndb.org/q8184", "vn_url": "https://vndb.org/v93"}, {"id": "q8811", "quote": "I'm sorry, but I am unable to find value in answering calls from thick-headed buffoons such as yourself.", "quote_zh": "抱歉，我无法找到接听像你这样的笨蛋的电话的价值。", "quote_zh_source": "mt", "character": "Senri Akane", "vn_id": "v751", "vn_title": "Rewrite", "vn_title_zh": "Rewrite", "score": 1, "motto_rank": 27, "source": "VNDB", "source_url": "https://vndb.org/q8811", "vn_url": "https://vndb.org/v751"}, {"id": "q8870", "quote": "I want three chicken tacos, cotton candy, and an ice cream for dessert. Oh, and don't forget a light coke because I'm on a diet.", "quote_zh": "我想要三个鸡肉炸玉米饼、棉花糖和一份冰淇淋作为甜点。哦，别忘了喝一杯淡可乐，因为我正在节食。", "quote_zh_source": "mt", "character": "Tina", "vn_id": "v51153", "vn_title": "Family Trouble", "vn_title_zh": "", "score": 1, "motto_rank": 27, "source": "VNDB", "source_url": "https://vndb.org/q8870", "vn_url": "https://vndb.org/v51153"}, {"id": "q4625", "quote": "...so that's why I'm trying to figure out if there is something I need to figure out and then figure that out before it's too late and all hope is lost.", "quote_zh": "……所以这就是为什么我试图弄清楚是否有什么东西我需要弄清楚，然后在为时已晚、所有希望都破灭之前弄清楚。", "quote_zh_source": "mt", "character": "Rin Tezuka", "vn_id": "v945", "vn_title": "Katawa Shoujo", "vn_title_zh": "片羽少女", "score": 26, "motto_rank": 26, "source": "VNDB", "source_url": "https://vndb.org/q4625", "vn_url": "https://vndb.org/v945"}, {"id": "q3347", "quote": "It's strange to hear someone say with complete certainty that they Never Died.", "quote_zh": "听到有人完全肯定地说他们从未死过，这很奇怪。", "quote_zh_source": "mt", "character": "Otonashi Ayana", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 16, "motto_rank": 26, "source": "VNDB", "source_url": "https://vndb.org/q3347", "vn_url": "https://vndb.org/v3144"}, {"id": "q4385", "quote": "I hope you get fat like a whale and drown in the Mariana Trench, you hog!", "quote_zh": "我希望你长得像鲸鱼一样，然后淹死在马里亚纳海沟里，你这个猪！", "quote_zh_source": "mt", "character": "Kuranari Takeshi", "vn_id": "v17", "vn_title": "Ever17 -the out of infinity-", "vn_title_zh": "永远的艾塞莉娅 DVD版", "score": 11, "motto_rank": 26, "source": "VNDB", "source_url": "https://vndb.org/q4385", "vn_url": "https://vndb.org/v17"}, {"id": "q4265", "quote": "It feels good, it tickles, and from time to time it hurts. But at the end of the day, it just feels good to kiss my sisters.", "quote_zh": "感觉很好，很痒，时不时还会痛。但归根结底，亲吻我的姐妹们感觉很好。", "quote_zh_source": "mt", "character": "Onii-chan", "vn_id": "v18694", "vn_title": "Onii-chan, Kiss no Junbi wa Mada Desu ka?", "vn_title_zh": "お兄ちゃん、キッスの準備はまだですか？", "score": 9, "motto_rank": 26, "source": "VNDB", "source_url": "https://vndb.org/q4265", "vn_url": "https://vndb.org/v18694"}, {"id": "q5706", "quote": "Restrictions on love are bullshit. There are no rules for falling in love.", "quote_zh": "对爱情的限制是胡说八道。坠入爱河没有任何规则。", "quote_zh_source": "mt", "character": "Yuuki Tomosane", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 8, "motto_rank": 26, "source": "VNDB", "source_url": "https://vndb.org/q5706", "vn_url": "https://vndb.org/v3144"}, {"id": "q104", "quote": "A gust of wind at the worst time could be all it takes to end someone's life.", "quote_zh": "最糟糕的时候，一阵风就能结束一个人的生命。", "quote_zh_source": "mt", "character": "", "vn_id": "v7721", "vn_title": "Utawarerumono: Itsuwari no Kamen", "vn_title_zh": "うたわれるもの 偽りの仮面", "score": 6, "motto_rank": 26, "source": "VNDB", "source_url": "https://vndb.org/q104", "vn_url": "https://vndb.org/v7721"}, {"id": "q6663", "quote": "And thus, today marks the day I sold my soul to Monika and her irresistible smile.", "quote_zh": "因此，今天标志着我将灵魂出卖给莫妮卡和她不可抗拒的微笑的日子。", "quote_zh_source": "mt", "character": "", "vn_id": "v21905", "vn_title": "Doki Doki Literature Club!", "vn_title_zh": "", "score": 6, "motto_rank": 26, "source": "VNDB", "source_url": "https://vndb.org/q6663", "vn_url": "https://vndb.org/v21905"}, {"id": "q7101", "quote": "If you find yourself hesitating in situations, then you must have the courage to stop and reflect upon what it is that made you who you are today...", "quote_zh": "如果你发现自己在某些情况下犹豫不决，那么你必须有勇气停下来反思是什么造就了今天的你……", "quote_zh_source": "mt", "character": "Koubuin Yuuhi", "vn_id": "v92", "vn_title": "Muv-Luv Alternative", "vn_title_zh": "Muv-Luv Alternative", "score": 6, "motto_rank": 26, "source": "VNDB", "source_url": "https://vndb.org/q7101", "vn_url": "https://vndb.org/v92"}, {"id": "q3435", "quote": "Again you are trying to come up with a Limitation of Truth by the Logic of This World...", "quote_zh": "你再次试图通过这个世界的逻辑来提出真理的限制......", "quote_zh_source": "mt", "character": "Mamiya Takuji", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 5, "motto_rank": 26, "source": "VNDB", "source_url": "https://vndb.org/q3435", "vn_url": "https://vndb.org/v3144"}, {"id": "q1777", "quote": "You cannot change the past or the actions of others, but you can change the future and try to change yourself.", "quote_zh": "你无法改变过去或他人的行为，但你可以改变未来并尝试改变自己。", "quote_zh_source": "mt", "character": "Morita Ken'ichi", "vn_id": "v57", "vn_title": "Sharin no Kuni, Himawari no Shoujo", "vn_title_zh": "车轮之国、向日葵的少女", "score": 4, "motto_rank": 26, "source": "VNDB", "source_url": "https://vndb.org/q1777", "vn_url": "https://vndb.org/v57"}, {"id": "q9068", "quote": "In the realm of beauty, everything betrays me. That is precisely why it can be trusted. It is precisely because beauty is irrational that I can trust it.", "quote_zh": "在美丽的境界里，一切都背叛了我。这正是它值得信赖的原因。正因为美是非理性的，所以我才可以相信它。", "quote_zh_source": "mt", "character": "Natsume Kei", "vn_id": "v20431", "vn_title": "Sakura no Toki -Sakura no Mori no Shita o Ayumu-", "vn_title_zh": "サクラノ刻－櫻の森の下を歩む－", "score": 4, "motto_rank": 26, "source": "VNDB", "source_url": "https://vndb.org/q9068", "vn_url": "https://vndb.org/v20431"}, {"id": "q9080", "quote": "Pain pierces the seabed in order to remain here… It tells me that I exist here—as myself.", "quote_zh": "为了留在这里，痛苦刺穿海底……它告诉我，我存在在这里——作为我自己。", "quote_zh_source": "mt", "character": "Kusanagi Naoya", "vn_id": "v20431", "vn_title": "Sakura no Toki -Sakura no Mori no Shita o Ayumu-", "vn_title_zh": "サクラノ刻－櫻の森の下を歩む－", "score": 4, "motto_rank": 26, "source": "VNDB", "source_url": "https://vndb.org/q9080", "vn_url": "https://vndb.org/v20431"}, {"id": "q7570", "quote": "Oops, sorry about that. I was just so happy, I forgot about my 'grown men only' policy.", "quote_zh": "哎呀，抱歉。我太高兴了，忘记了“仅限成年男性”的政策。", "quote_zh_source": "mt", "character": "Kouzuki Yuuko", "vn_id": "v92", "vn_title": "Muv-Luv Alternative", "vn_title_zh": "Muv-Luv Alternative", "score": 3, "motto_rank": 26, "source": "VNDB", "source_url": "https://vndb.org/q7570", "vn_url": "https://vndb.org/v92"}, {"id": "q5204", "quote": "I remember my old man saying there's never a perfect time to have a kid. Then again, he nicknamed me busted rubber...", "quote_zh": "我记得我的老人说过，生孩子从来都不是一个完美的时机。然后他又给我起了个绰号“坏橡胶”……", "quote_zh_source": "mt", "character": "Ryker Morris", "vn_id": "v33369", "vn_title": "Long Road Home", "vn_title_zh": "", "score": 2, "motto_rank": 26, "source": "VNDB", "source_url": "https://vndb.org/q5204", "vn_url": "https://vndb.org/v33369"}, {"id": "q1489", "quote": "I feel the great disturbance of a farce. As if millions of books cried out in terror, and were suddenly silenced.", "quote_zh": "我感受到了一场闹剧的巨大骚动。仿佛数以百万计的书籍惊恐地呼喊着，然后突然鸦雀无声。", "quote_zh_source": "mt", "character": "Kakei Kyoutarou", "vn_id": "v8158", "vn_title": "Daitoshokan no Hitsujikai", "vn_title_zh": "大図書館の羊飼い", "score": 1, "motto_rank": 26, "source": "VNDB", "source_url": "https://vndb.org/q1489", "vn_url": "https://vndb.org/v8158"}, {"id": "q3407", "quote": "The Sky Flooded with Strange Figures. A Shadow That Erased the Entire Sky...", "quote_zh": "天空中充斥着奇怪的身影。抹去整个天空的阴影……", "quote_zh_source": "mt", "character": "", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 1, "motto_rank": 26, "source": "VNDB", "source_url": "https://vndb.org/q3407", "vn_url": "https://vndb.org/v3144"}, {"id": "q6911", "quote": "I don't know much about the dark ages, or wherever it is Leofe comes from, but their justice system sounds pretty hardcore.", "quote_zh": "我不太了解黑暗时代，也不知道Leofe来自哪里，但他们的司法系统听起来相当铁杆。", "quote_zh_source": "mt", "character": "", "vn_id": "v28259", "vn_title": "The Fairy's Song", "vn_title_zh": "", "score": 1, "motto_rank": 26, "source": "VNDB", "source_url": "https://vndb.org/q6911", "vn_url": "https://vndb.org/v28259"}, {"id": "q7772", "quote": "Superior men and women come to this world for a reason, everything around them is nothing but objects, means through which to achieve their higher purpose.", "quote_zh": "优秀的男人和女人来到这个世界都是有原因的，他们周围的一切只不过是物体，是实现他们更高目标的手段。", "quote_zh_source": "mt", "character": "Maria Strauss", "vn_id": "v61829", "vn_title": "My Last War", "vn_title_zh": "", "score": 1, "motto_rank": 26, "source": "VNDB", "source_url": "https://vndb.org/q7772", "vn_url": "https://vndb.org/v61829"}, {"id": "q9256", "quote": "I always wondered why Kawano bopped Nozomu on the head all the time, but it's beginning to make a whole lot more sense.", "quote_zh": "我一直想知道为什么河野总是敲打希穆的头，但它开始变得更有意义了。", "quote_zh_source": "mt", "character": "Takeda Naoko", "vn_id": "v7302", "vn_title": "Hatsuyuki Sakura", "vn_title_zh": "", "score": 1, "motto_rank": 26, "source": "VNDB", "source_url": "https://vndb.org/q9256", "vn_url": "https://vndb.org/v7302"}, {"id": "q8934", "quote": "You don't believe me? You don't believe me! It's fine, I assure you! My lips are firmly sealed! If you like, why not push me down on the spot and confirm it with a kiss!?", "quote_zh": "你不相信我吗？你不相信我！没问题，我向你保证！我的嘴唇被牢牢地封住了！如果你愿意的话，不如当场把我推倒并亲吻确认一下吧！？", "quote_zh_source": "mt", "character": "Komine Sachi", "vn_id": "v5154", "vn_title": "Grisaia no Kajitsu -LE FRUIT DE LA GRISAIA-", "vn_title_zh": "グリザイアの果実 -LE FRUIT DE LA GRISAIA-", "score": 0, "motto_rank": 26, "source": "VNDB", "source_url": "https://vndb.org/q8934", "vn_url": "https://vndb.org/v5154"}, {"id": "q825", "quote": "You should just be surprised about one thing. You're not skilled enough to handle two.", "quote_zh": "你应该对一件事感到惊讶。你的技术不够熟练，无法同时处理两个。", "quote_zh_source": "mt", "character": "", "vn_id": "v11", "vn_title": "Fate/stay night", "vn_title_zh": "Fate/stay night", "score": -3, "motto_rank": 26, "source": "VNDB", "source_url": "https://vndb.org/q825", "vn_url": "https://vndb.org/v11"}, {"id": "q1605", "quote": "I don't know what's so unfair, but I think it's unfair that I don't konw what's unfair.", "quote_zh": "我不知道有什么不公平，但我觉得不知道什么不公平才是不公平。", "quote_zh_source": "mt", "character": "", "vn_id": "v11", "vn_title": "Fate/stay night", "vn_title_zh": "Fate/stay night", "score": -7, "motto_rank": 26, "source": "VNDB", "source_url": "https://vndb.org/q1605", "vn_url": "https://vndb.org/v11"}, {"id": "q2762", "quote": "If there's a logical explanation for something, then I'll believe it, but if there isn't one, I... will choose the most romantic option.", "quote_zh": "如果某件事有一个合乎逻辑的解释，那么我会相信它，但如果没有，我......会选择最浪漫的选择。", "quote_zh_source": "mt", "character": "Fuyukawa Kokoro", "vn_id": "v13", "vn_title": "Remember11 -the age of infinity-", almost funny. She has nothing left. Everything she ever had has been consumed. She's not a soldier, or a livestock, or a sample. Yet still, she wants to live on.", "quote_zh": "这几乎是可笑的。她已经一无所有了。她曾经拥有的一切都被消耗殆尽了。她不是士兵，不是牲畜，也不是样本。尽管如此，她还是想活下去。", "quote_zh_source": "mt", "character": "", "vn_id": "v29300", "vn_title": "Mahou Shoujo Shoumou Sensen - DeadΩAegis", "vn_title_zh": "魔法少女消耗戦線 DeadΩAegis", "score": 3, "motto_rank": 23, "source": "VNDB", "source_url": "https://vndb.org/q2573", "vn_url": "https://vndb.org/v29300"}, {"id": "q7005", "quote": "I don't wanna come across as a yandere. I know some people are into that, but I think those types need to get their heads examined.", "quote_zh": "我不想给人留下病娇的印象。我知道有些人对此很感兴趣，但我认为这些人需要好好检查一下自己的头脑。", "quote_zh_source": "mt", "character": "Marnie", "vn_id": "v37768", "vn_title": "The Fairy's Secret", "vn_title_zh": "", "score": 3, "motto_rank": 23, "source": "VNDB", "source_url": "https://vndb.org/q7005", "vn_url": "https://vndb.org/v37768"}, {"id": "q681", "quote": "If you want to be closer to someone, you have to lay down your weapon and take off your armor.", "quote_zh": "如果你想和某人更亲近，就必须放下武器，脱下盔甲。", "quote_zh_source": "mt", "character": "", "vn_id": "v8158", "vn_title": "Daitoshokan no Hitsujikai", "vn_title_zh": "大図書館の羊飼い", "score": 2, "motto_rank": 23, "source": "VNDB", "source_url": "https://vndb.org/q681", "vn_url": "https://vndb.org/v8158"}, {"id": "q4356", "quote": "Oh, because you’re so incredibly reliable… GO SCREW YOURSELF!", "quote_zh": "哦，因为你是如此可靠……去吧，去吧！", "quote_zh_source": "mt", "character": "", "vn_id": "v211", "vn_title": "G-senjou no Maou", "vn_title_zh": "G線上の魔王", "score": 2, "motto_rank": 23, "source": "VNDB", "source_url": "https://vndb.org/q4356", "vn_url": "https://vndb.org/v211"}, {"id": "q7571", "quote": "Oh, and Shirogane? I suggest you use protection if you plan on graduating... Oh wait, you've only got three months left, huh? Guess it's not THAT big a deal then.", "quote_zh": "哦，还有白银？如果你打算毕业，我建议你使用保护措施……哦等等，你只剩下三个月的时间了，是吧？我想这没什么大不了的。", "quote_zh_source": "mt", "character": "Kouzuki Yuuko", "vn_id": "v92", "vn_title": "Muv-Luv Alternative", "vn_title_zh": "Muv-Luv Alternative", "score": 2, "motto_rank": 23, "source": "VNDB", "source_url": "https://vndb.org/q7571", "vn_url": "https://vndb.org/v92"}, {"id": "q8248", "quote": "The whole world already knows you’re a moron. You didn’t need to break a plate to prove your point.", "quote_zh": "全世界都知道你是个白痴。你不需要打破盘子来证明你的观点。", "quote_zh_source": "mt", "character": "Daikuuji Ayu", "vn_id": "v94", "vn_title": "Kimi ga Nozomu Eien", "vn_title_zh": "君が望む永遠", "score": 2, "motto_rank": 23, "source": "VNDB", "source_url": "https://vndb.org/q8248", "vn_url": "https://vndb.org/v94"}, {"id": "q9072", "quote": "Only weak humans can believe in a weak god. Because weakness is overlapping notes of music.", "quote_zh": "只有弱小的人类才能相信弱小的神。因为弱点是音乐的音符重叠。", "quote_zh_source": "mt", "character": "Kusanagi Naoya", "vn_id": "v20431", "vn_title": "Sakura no Toki -Sakura no Mori no Shita o Ayumu-", "vn_title_zh": "サクラノ刻－櫻の森の下を歩む－", "score": 2, "motto_rank": 23, "source": "VNDB", "source_url": "https://vndb.org/q9072", "vn_url": "https://vndb.org/v20431"}, {"id": "q742", "quote": "Even if the cattle were to charge in with machine guns, I'd tell my men the same thing. 'Go and die. Your corpses will be our shields.'", "quote_zh": "即使牛群用机枪冲锋，我也会告诉我的手下同样的事情。 ‘去死吧。你的尸体将成为我们的盾牌。", "quote_zh_source": "mt", "character": "", "vn_id": "v211", "vn_title": "G-senjou no Maou", "vn_title_zh": "G線上の魔王", "score": 1, "motto_rank": 23, "source": "VNDB", "source_url": "https://vndb.org/q742", "vn_url": "https://vndb.org/v211"}, {"id": "q4354", "quote": "I’D RATHER BETRAY THE WORLD THAN LET THE WORLD BETRAY ME!", "quote_zh": "宁愿背叛世界，也不让世界背叛我！", "quote_zh_source": "mt", "character": "", "vn_id": "v211", "vn_title": "G-senjou no Maou", "vn_title_zh": "G線上の魔王", "score": 1, "motto_rank": 23, "source": "VNDB", "source_url": "https://vndb.org/q4354", "vn_url": "https://vndb.org/v211"}, {"id": "q6070", "quote": "I'd reached my twenty-second summer with no accomplishments, no memories, and I was going to die.", "quote_zh": "我已经度过了第二十二个夏天，没有任何成就，没有任何记忆，我快要死了。", "quote_zh_source": "mt", "character": "", "vn_id": "v18739", "vn_title": "narcissu Sumire", "vn_title_zh": "", "score": 1, "motto_rank": 23, "source": "VNDB", "source_url": "https://vndb.org/q6070", "vn_url": "https://vndb.org/v18739"}, {"id": "q7457", "quote": "Truth is not something that is hidden away, waiting to be discovered by philosophical or scientific investigations, no: truth is something that is out there in the world.", "quote_zh": "真理不是隐藏起来的、等待哲学或科学研究发现的东西，不是：真理是世界上存在的东西。", "quote_zh_source": "mt", "character": "Maria Strauss", "vn_id": "v61829", "vn_title": "My Last War", "vn_title_zh": "", "score": 1, "motto_rank": 23, "source": "VNDB", "source_url": "https://vndb.org/q7457", "vn_url": "https://vndb.org/v61829"}, {"id": "q7727", "quote": "When people eat saury, it must form a dimension of ecstasy that transcends time and space in one's brain...", "quote_zh": "人们吃秋刀鱼的时候，一定会在大脑中形成一种超越时空的狂喜维度……", "quote_zh_source": "mt", "character": "Nakatsu Shizuru", "vn_id": "v751", "vn_title": "Rewrite", "vn_title_zh": "Rewrite", "score": 1, "motto_rank": 23, "source": "VNDB", "source_url": "https://vndb.org/q7727", "vn_url": "https://vndb.org/v751"}, {"id": "q8761", "quote": "\"There was a darkness, deep within your heart. A darkness you didn't even realize you had. The less power someone has, the more they desire to be saved by someone else.\"", "quote_zh": "“你的内心深处有一种黑暗。一种你甚至没有意识到自己拥有的黑暗。一个人的力量越少，他们就越渴望被别人拯救。”", "quote_zh_source": "mt", "character": "Leonhardt Arknoah", "vn_id": "v15641", "vn_title": "VenusBlood -HYPNO-", "vn_title_zh": "", "score": 1, "motto_rank": 23, "source": "VNDB", "source_url": "https://vndb.org/q8761", "vn_url": "https://vndb.org/v15641"}, {"id": "q9440", "quote": "I've got the cleanest asshole out of anyone in the world!", "quote_zh": "我是世界上最干净的混蛋！", "quote_zh_source": "mt", "character": "Minakami Yuki", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 1, "motto_rank": 23, "source": "VNDB", "source_url": "https://vndb.org/q9440", "vn_url": "https://vndb.org/v3144"}, {"id": "q9477", "quote": "To tell you the truth, I was a girl all along. I used narrative tricks to hide my identity.", "quote_zh": "说实话，我一直都是个女孩。我用叙事技巧来隐藏我的身份。", "quote_zh_source": "mt", "character": "", "vn_id": "v751", "vn_title": "Rewrite", "vn_title_zh": "Rewrite", "score": 1, "motto_rank": 23, "source": "VNDB", "source_url": "https://vndb.org/q9477", "vn_url": "https://vndb.org/v751"}, {"id": "q9549", "quote": "I have many mysteries about myself.   Perhaps the heart I acquired since gaining awareness has some kind of congenital defect.", "quote_zh": "我自己有很多谜团。   或许我自觉醒后所获得的心脏，有某种先天的缺陷。", "quote_zh_source": "mt", "character": "", "vn_id": "v1278", "vn_title": "Saihate no Ima", "vn_title_zh": "最果てのイマ", "score": 1, "motto_rank": 23, "source": "VNDB", "source_url": "https://vndb.org/q9549", "vn_url": "https://vndb.org/v1278"}, {"id": "q9570", "quote": "Miss Homo Serves-no-purpose, you'd better start getting motivated or you won't live a meaningful life.", "quote_zh": "同性恋小姐没有任何目的，你最好开始变得有动力，否则你将不会过有意义的生活。", "quote_zh_source": "mt", "character": "Kagari", "vn_id": "v8020", "vn_title": "Rewrite Harvest festa!", "vn_title_zh": "", "score": 1, "motto_rank": 23, "source": "VNDB", "source_url": "https://vndb.org/q9570", "vn_url": "https://vndb.org/v8020"}, {"id": "q9589", "quote": "It was the first time in my life that I truly wanted to kill myself.", "quote_zh": "这是我一生中第一次真正想要自杀。", "quote_zh_source": "mt", "character": "", "vn_id": "v1130", "vn_title": "Shuusaku", "vn_title_zh": "臭作", "score": 1, "motto_rank": 23, "source": "VNDB", "source_url": "https://vndb.org/q9589", "vn_url": "https://vndb.org/v1130"}, {"id": "q2666", "quote": "Once, I struggled with emotions. My power spiraled with my heart , even if it'd cost your own life. Because... these chicks are _my_ women.", "quote_zh": "大家，你们都待在这里。尘埃，你的责任就是保护他们，即使这会牺牲你自己的生命。因为……这些小妞是我的女人。", "quote_zh_source": "mt", "character": "", "vn_id": "v1460", "vn_title": "MinDeaD BlooD ~Mayu to Mana no Yuketsubako~", "vn_title_zh": "MinDeaD BlooD ～麻由と麻奈の輸血箱～", "score": -1, "motto_rank": 23, "source": "VNDB", "source_url": "https://vndb.org/q1200", "vn_url": "https://vndb.org/v1460"}, {"id": "q6978", "quote": "I don't need my freaking testimony to save her. I hope my testimony is useless because she's already home.", "quote_zh": "我不需要我那该死的证词来拯救她。我希望我的证词没有用，因为她已经回家了。", "quote_zh_source": "mt", "character": "Asya Shubina", "vn_id": "v58641", "vn_title": "Z.A.T.O. // I Love the World and Everything In It", "vn_title_zh": "", "score": -7, "motto_rank": 23, "source": "VNDB", "source_url": "https://vndb.org/q6978", "vn_url": "https://vndb.org/v58641"}, {"id": "q4616", "quote": "Even after I stop being human, I hope I'll still enjoy the taste of booze.", "quote_zh": "即使我不再是人类，我希望我仍然能享受酒的味道。", "quote_zh_source": "mt", "character": "", "vn_id": "v97", "vn_title": "Saya no Uta", "vn_title_zh": "沙耶之歌", "score": 35, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q4616", "vn_url": "https://vndb.org/v97"}, {"id": "q3377", "quote": "Having not even known Life, how can you judge Death?", "quote_zh": "连生都不认识，怎么能判断死呢？", "quote_zh_source": "mt", "character": "Otonashi Ayana", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 32, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q3377", "vn_url": "https://vndb.org/v3144"}, {"id": "q4675", "quote": "Nah, it's gotta be an isekai deal. It’ll be like, \"That Time I Got Reincarnated As The World's Last Hope But The Overlord Forced Me To Kill All My Friends!\"", "quote_zh": "不，这一定是异世界交易。就像“那次我转世为世界最后的希望，霸主却逼我杀掉所有朋友！”", "quote_zh_source": "mt", "character": "Amemiya Darumi", "vn_id": "v54897", "vn_title": "HUNDRED LINE -Saishuu Bouei Gakuen-", "vn_title_zh": "HUNDRED LINE -最終防衛学園-", "score": 32, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q4675", "vn_url": "https://vndb.org/v54897"}, {"id": "q2065", "quote": "\"But… I see, even Mitsuzuri is weak against molesters. I guess that's good. It's impossible to teach her femininity unless something like this happens.\"", "quote_zh": "「但是……我明白了，即使是蜜织，对于猥亵者来说也很弱。我想这很好。除非发生这样的事情，否则不可能教会她女性气质。」", "quote_zh_source": "mt", "character": "Emiya Shirou", "vn_id": "v11", "vn_title": "Fate/stay night", "vn_title_zh": "Fate/stay night", "score": 30, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q2065", "vn_url": "https://vndb.org/v11"}, {"id": "q4452", "quote": "If you don't think sisters are cute and you don't think old men are cute, it's like you're saying you don't like anyone!", "quote_zh": "如果你不觉得姐妹可爱，也不觉得老人可爱，那就等于你不喜欢任何人！", "quote_zh_source": "mt", "character": "Minakami Yuki", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 24, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q4452", "vn_url": "https://vndb.org/v3144"}, {"id": "q1126", "quote": "...It's good to be a doctor... because I get to touch the skin of young people many times, and I can turn them into my slaves with a little injection...", "quote_zh": "……当医生真好……因为我可以多次接触年轻人的皮肤，只要打一点针，我就能把他们变成我的奴隶……", "quote_zh_source": "mt", "character": "", "vn_id": "v68", "vn_title": "Higurashi no Naku Koro ni Kai", "vn_title_zh": "ひぐらしのなく頃に解", "score": 22, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q1126", "vn_url": "https://vndb.org/v68"}, {"id": "q1603", "quote": "I wanted to leave you two, since you made a rather ugly pair as abandoned children go", "quote_zh": "我想离开你们两个，因为你们是被遗弃的孩子中相当难看的一对", "quote_zh_source": "mt", "character": "", "vn_id": "v11", "vn_title": "Fate/stay night", "vn_title_zh": "Fate/stay night", "score": 22, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q1603", "vn_url": "https://vndb.org/v11"}, {"id": "q6715", "quote": "Have you considered killing yourself? It would be beneficial to your mental health.", "quote_zh": "你有没有考虑过自杀？这对您的心理健康有益。", "quote_zh_source": "mt", "character": "Yuri", "vn_id": "v21905", "vn_title": "Doki Doki Literature Club!", "vn_title_zh": "", "score": 20, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q6715", "vn_url": "https://vndb.org/v21905"}, {"id": "q274", "quote": "Praying is futile. Because in this world we live in————God doesn't exist.", "quote_zh": "祈祷是徒劳的。因为我们生活的这个世界————上帝不存在。", "quote_zh_source": "mt", "character": "", "vn_id": "v324", "vn_title": "EXTRAVAGANZA ~Mushi Mederu Shoujo~", "vn_title_zh": "EXTRAVAGANZA ～蟲愛でる少女～", "score": 19, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q274", "vn_url": "https://vndb.org/v324"}, {"id": "q2003", "quote": "That's not true! If I wasn't happy or satisfied with my life with you, I wouldn't have written a story like this. That's why... I'm sorry for forgetting it.", "quote_zh": "那不是真的！如果我对和你在一起的生活不快乐或不满意，我就不会写这样的故事。这就是为什么……抱歉忘记了。", "quote_zh_source": "mt", "character": "Yonagi", "vn_id": "v26987", "vn_title": "Hakuchuumu no Aojashin", "vn_title_zh": "白昼夢の青写真", "score": 18, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q2003", "vn_url": "https://vndb.org/v26987"}, {"id": "q4232", "quote": "I suppose the world isn't ready for something as revolutionary as communal boobs.", "quote_zh": "我想世界还没有准备好接受像公共胸部这样的革命性事物。", "quote_zh_source": "mt", "character": "Mizuori Shizuku", "vn_id": "v20424", "vn_title": "Summer Pockets", "vn_title_zh": "", "score": 18, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q4232", "vn_url": "https://vndb.org/v20424"}, {"id": "q877", "quote": "My body may look strong as steel, but my heart is as soft as tissue. Can't you wrap your words in Saran wrap just a little?", "quote_zh": "我的身体看起来像钢铁一样坚强，但我的心却像组织一样柔软。你就不能把你的话用保鲜膜包裹一下吗？", "quote_zh_source": "mt", "character": "Inohara Masato", "vn_id": "v5", "vn_title": "Little Busters!", "vn_title_zh": "Little Busters!", "score": 17, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q877", "vn_url": "https://vndb.org/v5"}, {"id": "q2515", "quote": "Good and evil don't matter. To me, what's right is simply what's most precious to me.", "quote_zh": "善与恶并不重要。对我来说，正确的事情对我来说才是最珍贵的。", "quote_zh_source": "mt", "character": "Tennouji Kotarou", "vn_id": "v751", "vn_title": "Rewrite", "vn_title_zh": "Rewrite", "score": 15, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q2515", "vn_url": "https://vndb.org/v751"}, {"id": "q3110", "quote": "\"This world is full of monkeys that can't contain their curiosity, after all.\"", "quote_zh": "“毕竟，这个世界上充满了无法抑制好奇心的猴子。”", "quote_zh_source": "mt", "character": "Senri Akane", "vn_id": "v751", "vn_title": "Rewrite", "vn_title_zh": "Rewrite", "score": 15, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q3110", "vn_url": "https://vndb.org/v751"}, {"id": "q5800", "quote": "I'm afraid your big sister can't respect that opinion. It's no different than claiming it's a violation of human rights when a 2D girl in a eroge gets raped.", "quote_zh": "恐怕你姐姐不能尊重这个意见。这与声称游戏中的 2D 女孩被强奸是侵犯人权没有什么不同。", "quote_zh_source": "mt", "character": "Minakami Yuki", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 15, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q5800", "vn_url": "https://vndb.org/v3144"}, {"id": "q635", "quote": "You should just watch out for cars, crows and a baker guy whose eyes look piercing", "quote_zh": "你应该小心汽车、乌鸦和一个眼神锐利的面包师", "quote_zh_source": "mt", "character": "", "vn_id": "v4", "vn_title": "CLANNAD", "vn_title_zh": "CLANNAD", "score": 12, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q635", "vn_url": "ht
