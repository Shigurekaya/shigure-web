ing straight from a head of lettuce with nothing but ketchup as a topping.", "quote_zh": "萨拉直接吃一棵生菜，只用番茄酱作为配料。", "quote_zh_source": "mt", "character": "", "vn_id": "v17", "vn_title": "Ever17 -the out of infinity-", "vn_title_zh": "永远的艾塞莉娅 DVD版", "score": 10, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q3853", "vn_url": "https://vndb.org/v17"}, {"id": "q3301", "quote": "They were imbued with the Sound of the Savior's speech, but not with the Meaning.", "quote_zh": "他们充满了救世主演讲的声音，但没有意义。", "quote_zh_source": "mt", "character": "Mamiya Takuji", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 8, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q3301", "vn_url": "https://vndb.org/v3144"}, {"id": "q4226", "quote": "Haha, what man doesn't want a harem? The Middle East is one of my dream destinations.", "quote_zh": "哈哈，哪个男人不想要后宫呢？中东是我梦想的目的地之一。", "quote_zh_source": "mt", "character": "Kakei Kyoutarou", "vn_id": "v8158", "vn_title": "Daitoshokan no Hitsujikai", "vn_title_zh": "大図書館の羊飼い", "score": 7, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q4226", "vn_url": "https://vndb.org/v8158"}, {"id": "q6005", "quote": "Your hair's soft. Ah, but you'll probably lose it in the future, anyway.", "quote_zh": "你的头发很软。啊，但无论如何，你将来可能会失去它。", "quote_zh_source": "mt", "character": "Sakagami Tomoyo", "vn_id": "v4", "vn_title": "CLANNAD", "vn_title_zh": "CLANNAD", "score": 7, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q6005", "vn_url": "https://vndb.org/v4"}, {"id": "q4704", "quote": "I see her just as I do everything else--as something other than what she really is.", "quote_zh": "我对她的看法就像我对其他事情的看法一样——与她的真实面目不同。", "quote_zh_source": "mt", "character": "Sakisaka Fuminori", "vn_id": "v97", "vn_title": "Saya no Uta", "vn_title_zh": "沙耶之歌", "score": 6, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q4704", "vn_url": "https://vndb.org/v97"}, {"id": "q7721", "quote": "Then you get red pickled ginger for dinner tonight. A whole bowl of it, with extra red pickled ginger on top! For your drink you get ginger juice.", "quote_zh": "然后今晚你吃红腌姜当晚餐。一整碗，上面还加了红姜！你的饮料是姜汁。", "quote_zh_source": "mt", "character": "Minase Nayuki", "vn_id": "v33", "vn_title": "Kanon", "vn_title_zh": "Kanon", "score": 6, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q7721", "vn_url": "https://vndb.org/v33"}, {"id": "q9059", "quote": "Only after I found the void did I discover beauty—but beyond that, even the void itself eventually vanished. And in the end, only beauty remained with me.", "quote_zh": "当我找到虚空之后，我才发现了美——但除此之外，连虚空本身最终也消失了。最终，只有美丽留在了我身边。", "quote_zh_source": "mt", "character": "Natsume Kei", "vn_id": "v20431", "vn_title": "Sakura no Toki -Sakura no Mori no Shita o Ayumu-", "vn_title_zh": "サクラノ刻－櫻の森の下を歩む－", "score": 6, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q9059", "vn_url": "https://vndb.org/v20431"}, {"id": "q695", "quote": "Anyway, I'm really grateful. If I were a guy, I'd lock you up and love you every night.", "quote_zh": "无论如何，我真的很感激。如果我是个男人，我会把你锁起来，每天晚上都爱你。", "quote_zh_source": "mt", "character": "", "vn_id": "v211", "vn_title": "G-senjou no Maou", "vn_title_zh": "G線上の魔王", "score": 5, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q695", "vn_url": "https://vndb.org/v211"}, {"id": "q2600", "quote": "(She definitely thinks i'm obnoxious... Argh, i want to hide under a rock. I want to reverse time and try this over again!)", "quote_zh": "（她肯定觉得我很讨厌……哎呀，我想躲在石头下面。我想倒转时间，再试一次！）", "quote_zh_source": "mt", "character": "Mell Rhodes", "vn_id": "v12402", "vn_title": "Fata Morgana no Yakata", "vn_title_zh": "海市蜃楼之馆", "score": 5, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q2600", "vn_url": "https://vndb.org/v12402"}, {"id": "q3330", "quote": "A person who is able to see the Truth will see it everywhere he looks, and will be Right.", "quote_zh": "一个能够看到真理的人，他所看到的任何地方都会看到真理，并且是正确的。", "quote_zh_source": "mt", "character": "Mamiya Takuji", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 5, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q3330", "vn_url": "https://vndb.org/v3144"}, {"id": "q4780", "quote": "A gigantic, soulless, orange infant, 2 rotary phones, a sock puppet, the purple-muppet baby that the world tried to forget, and the Dog of Christmas Past.", "quote_zh": "一个巨大的、没有灵魂的橙色婴儿、两部旋转电话、一个袜子木偶、世界试图忘记的紫色布偶婴儿，以及过去圣诞节的狗。", "quote_zh_source": "mt", "character": "", "vn_id": "v30547", "vn_title": "Dayshift at Freddy's 3", "vn_title_zh": "", "score": 5, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q4780", "vn_url": "https://vndb.org/v30547"}, {"id": "q5409", "quote": "I will lay waste to humanity, ascend to godhood, and by divine right claim what is mine!", "quote_zh": "我将毁灭人类，提升神性，并凭借神圣的权利索取属于我的东西！", "quote_zh_source": "mt", "character": "Minato Hikaru", "vn_id": "v2016", "vn_title": "Soukou Akki Muramasa", "vn_title_zh": "装甲恶鬼村正", "score": 5, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q5409", "vn_url": "https://vndb.org/v2016"}, {"id": "q9105", "quote": "The world is beautiful, even in the saddest moment— and cruel, even in the happiest.", "quote_zh": "即使在最悲伤的时刻，世界也是美丽的；即使在最幸福的时刻，世界也是残酷的。", "quote_zh_source": "mt", "character": "Kusanagi Naoya", "vn_id": "v20431", "vn_title": "Sakura no Toki -Sakura no Mori no Shita o Ayumu-", "vn_title_zh": "サクラノ刻－櫻の森の下を歩む－", "score": 5, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q9105", "vn_url": "https://vndb.org/v20431"}, {"id": "q999", "quote": "My, you really don't remember? Meat and potato stew... has a lot of meat and potatoes in it, don't you know?", "quote_zh": "亲，你真的不记得了吗？土豆炖肉……里面有很多肉和土豆，你不知道吗？", "quote_zh_source": "mt", "character": "", "vn_id": "v8158", "vn_title": "Daitoshokan no Hitsujikai", "vn_title_zh": "大図書館の羊飼い", "score": 4, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q999", "vn_url": "https://vndb.org/v8158"}, {"id": "q9058", "quote": "Then that’s enough. That’s all there is to it. Because that moment itself is eternity.", "quote_zh": "那么就足够了。这就是全部了。因为那一刻本身就是永恒。", "quote_zh_source": "mt", "character": "Natsume Kei", "vn_id": "v20431", "vn_title": "Sakura no Toki -Sakura no Mori no Shita o Ayumu-", "vn_title_zh": "サクラノ刻－櫻の森の下を歩む－", "score": 4, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q9058", "vn_url": "https://vndb.org/v20431"}, {"id": "q4872", "quote": "It's impossible to look at the world from my own narrow viewpoint and grasp even a fragment of the life, the energy of all the people that make this world turn.", "quote_zh": "我不可能以自己狭隘的视角来看待这个世界，也无法掌握生命的一小部分，以及使这个世界运转的所有人的能量。", "quote_zh_source": "mt", "character": "Arishima Kaoru", "vn_id": "v26987", "vn_title": "Hakuchuumu no Aojashin", "vn_title_zh": "白昼夢の青写真", "score": 3, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q4872", "vn_url": "https://vndb.org/v26987"}, {"id": "q5084", "quote": "Maybe you can strengthen your glutes and propel yourself with the power of your farts.", "quote_zh": "也许你可以增强你的臀肌并利用放屁的力量来推动自己。", "quote_zh_source": "mt", "character": "Gil", "vn_id": "v751", "vn_title": "Rewrite", "vn_title_zh": "Rewrite", "score": 3, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q5084", "vn_url": "https://vndb.org/v751"}, {"id": "q5324", "quote": "Because you don’t realize things are going well. You start thinking this is normal. But it’s not. A life that sparkles—", "quote_zh": "因为你没有意识到事情进展顺利。你开始认为这是正常的。但事实并非如此。闪闪发光的生活——", "quote_zh_source": "mt", "character": "Kusanagi Naoya", "vn_id": "v562", "vn_title": "Sakura no Uta -Sakura no Mori no Ue o Mau-", "vn_title_zh": "サクラノ詩－櫻の森の上を舞う－", "score": 3, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q5324", "vn_url": "https://vndb.org/v562"}, {"id": "q6371", "quote": "Do you really want to die?! Want me to strangle you for twenty minutes until I almost break your neck? Huh?!", "quote_zh": "你真的想死吗？！要我掐死你二十分钟，直到差点扭断你的脖子吗？啊？！", "quote_zh_source": "mt", "character": "Fujibayashi Kyou", "vn_id": "v4", "vn_title": "CLANNAD", "vn_title_zh": "CLANNAD", "score": 3, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q6371", "vn_url": "https://vndb.org/v4"}, {"id": "q6570", "quote": "If you root for both parties during a match, and clap every time a point is scored, you end up rooting for the winner more in the end, right? I'd hate that.", "quote_zh": "如果你在比赛中支持双方，并在每次得分时鼓掌，那么最终你会更加支持胜利者，对吗？我讨厌那样。", "quote_zh_source": "mt", "character": "Aoyagi Shion", "vn_id": "v12849", "vn_title": "Ao no Kanata no Four Rhythm", "vn_title_zh": "青空下的四重奏", "score": 3, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q6570", "vn_url": "https://vndb.org/v12849"}, {"id": "q7767", "quote": "Right now, you're some kind of omnisexual pervert who thinks inanimate objects are hot. But in elementary school, you were still an innocent child.", "quote_zh": "现在，你是某种全性变态，认为无生命的物体很性感。但在小学的时候，你还是一个天真的孩子。", "quote_zh_source": "mt", "character": "Okabe Rintarou", "vn_id": "v2002", "vn_title": "STEINS;GATE", "vn_title_zh": "命运石之门", "score": 3, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q7767", "vn_url": "https://vndb.org/v2002"}, {"id": "q7825", "quote": "Had they yearned for more light, or had they come to despise the tiny patch of it that trickled into the room?", "quote_zh": "他们是渴望更多的光线，还是开始鄙视那滴进房间的一小片光线？", "quote_zh_source": "mt", "character": "", "vn_id": "v12402", "vn_title": "Fata Morgana no Yakata", "vn_title_zh": "海市蜃楼之馆", "score": 3, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q7825", "vn_url": "https://vndb.org/v12402"}, {"id": "q5893", "quote": "I am Mabuchi Meiyou, and she is—I crave only to melt into the radiance of her beauty. That alone stirs my soul.", "quote_zh": "我是万渊明幽，而她也是——我只渴望融入她美丽的光辉之中。仅此一点就触动了我的灵魂。", "quote_zh_source": "mt", "character": "Mabuchi Meiyou", "vn_id": "v28398", "vn_title": "Club Suicide", "vn_title_zh": "", "score": 2, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q5893", "vn_url": "https://vndb.org/v28398"}, {"id": "q9252", "quote": "Everyone desires freedom, but no human being can truly endure a freedom in which they receive absolutely no interference from others or from the outside world.", "quote_zh": "每个人都渴望自由，但没有人能够真正忍受一种完全不受他人或外界干扰的自由。", "quote_zh_source": "mt", "character": "Hondou Sayaka", "vn_id": "v1278", "vn_title": "Saihate no Ima", "vn_title_zh": "最果てのイマ", "score": 2, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q9252", "vn_url": "https://vndb.org/v1278"}, {"id": "q4415", "quote": "You start with those close to you, then your attachments grow and grow until one day, you realize there will be no peace until the world is safe.", "quote_zh": "你从那些亲近的人开始，然后你的依恋不断增长，直到有一天，你意识到，除非世界安全，否则不会有和平。", "quote_zh_source": "mt", "character": "", "vn_id": "v4463", "vn_title": "Muv-Luv Unlimited: The Day After", "vn_title_zh": "", "score": 1, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q4415", "vn_url": "https://vndb.org/v4463"}, {"id": "q6901", "quote": "It's true cities have higher crime rates, but maybe the ever-present, omniscient threat of being stabbed would add some much needed excitement to my life...", "quote_zh": "城市的犯罪率确实较高，但也许无处不在、无所不知的被刺伤威胁会给我的生活增添一些急需的兴奋……", "quote_zh_source": "mt", "character": "", "vn_id": "v28259", "vn_title": "The Fairy's Song", "vn_title_zh": "", "score": 1, "motto_rank": 22, "source": "VNDB", "source_url": "https://vndb.org/q6901", "vn_url": "https://vndb.org/v28259"}, {"id": "q8593", "quote": "So a pair of boobs are going to tutor me in my spare time. Boobs are amazing.", "quote_zh": "所以业余时间一对胸部会辅导我。胸部太棒了。", "quote_zh_source": "mt", "character": "", "vn_id": "v20424  "v20194", "vn_title": "Grisaia: Phantom Trigger Vol. 1", "vn_title_zh": "", "score": 7, "motto_rank": 21, "source": "VNDB", "source_url": "https://vndb.org/q1119", "vn_url": "https://vndb.org/v20194"}, {"id": "q660", "quote": "Kohaku-san really must have taken a liking to the butter cake, because she's stroking the snack packet like it's some kind of treasure.", "quote_zh": "琥珀小姐一定很喜欢黄油蛋糕，因为她抚摸着零食包，就像抚摸着什么宝贝一样。", "quote_zh_source": "mt", "character": "", "vn_id": "v17909", "vn_title": "Tsukihime -A piece of blue glass moon-", "vn_title_zh": "月姫 -A piece of blue glass moon-", "score": 6, "motto_rank": 21, "source": "VNDB", "source_url": "https://vndb.org/q660", "vn_url": "https://vndb.org/v17909"}, {"id": "q4244", "quote": "When your heart starts to ache, and when you start to shed tears... I'll take your life, softer than sand, and destroy it for you.", "quote_zh": "当你的心开始疼痛，当你开始流泪……我会夺走你比沙子还柔软的生命，为你毁灭它。", "quote_zh_source": "mt", "character": "Domeki Kuguri", "vn_id": "v53425", "vn_title": "18TRIP", "vn_title_zh": "", "score": 5, "motto_rank": 21, "source": "VNDB", "source_url": "https://vndb.org/q4244", "vn_url": "https://vndb.org/v53425"}, {"id": "q4555", "quote": "I don't want to go because you're a 'girl' - I want to go because it's with you, Mai-chan.", "quote_zh": "我不想去，因为你是个‘女孩’——我想去，因为和你在一起，舞酱。", "quote_zh_source": "mt", "character": "Protagonist", "vn_id": "v1296", "vn_title": "Tsuki no Terasu", "vn_title_zh": "月照～ツキノテラス～", "score": 5, "motto_rank": 21, "source": "VNDB", "source_url": "https://vndb.org/q4555", "vn_url": "https://vndb.org/v1296"}, {"id": "q9061", "quote": "Your unfinished brush is a wing that strives toward infinity. And because it remains endlessly incomplete—it surpasses even me.", "quote_zh": "你未完成的画笔是一只向着无限努力的翅膀。而且因为它永远不完整——它甚至超越了我。", "quote_zh_source": "mt", "character": "Natsume Kei", "vn_id": "v20431", "vn_title": "Sakura no Toki -Sakura no Mori no Shita o Ayumu-", "vn_title_zh": "サクラノ刻－櫻の森の下を歩む－", "score": 5, "motto_rank": 21, "source": "VNDB", "source_url": "https://vndb.org/q9061", "vn_url": "https://vndb.org/v20431"}, {"id": "q1264", "quote": "Is anyone going to retort to that first part? Or do they all think I'm on the sex offender registry?", "quote_zh": "有人要反驳第一部分吗？或者他们都认为我在性犯罪者登记册上？", "quote_zh_source": "mt", "character": "", "vn_id": "v8158", "vn_title": "Daitoshokan no Hitsujikai", "vn_title_zh": "大図書館の羊飼い", "score": 4, "motto_rank": 21, "source": "VNDB", "source_url": "https://vndb.org/q1264", "vn_url": "https://vndb.org/v8158"}, {"id": "q4357", "quote": "Last week, I went to go buy a toilet seat cover… But I wasn’t sure whether to get a U-shaped one or a O-shaped one, so I just ended up leaving…", "quote_zh": "上周我去买了个马桶盖……但是不知道买U型的还是O型的，所以就走了……", "quote_zh_source": "mt", "character": "", "vn_id": "v211", "vn_title": "G-senjou no Maou", "vn_title_zh": "G線上の魔王", "score": 4, "motto_rank": 21, "source": "VNDB", "source_url": "https://vndb.org/q4357", "vn_url": "https://vndb.org/v211"}, {"id": "q9082", "quote": "Our melodies are such small things. Because this world is infinite.", "quote_zh": "我们的旋律是如此微小。因为这个世界是无限的。", "quote_zh_source": "mt", "character": "Kusanagi Naoya", "vn_id": "v20431", "vn_title": "Sakura no Toki -Sakura no Mori no Shita o Ayumu-", "vn_title_zh": "サクラノ刻－櫻の森の下を歩む－", "score": 4, "motto_rank": 21, "source": "VNDB", "source_url": "https://vndb.org/q9082", "vn_url": "https://vndb.org/v20431"}, {"id": "q9084", "quote": "The limits of beauty… must be the limits of myself… nothing less.", "quote_zh": "美的极限……一定是我自己的极限……仅此而已。", "quote_zh_source": "mt", "character": "Nagayama Kana", "vn_id": "v20431", "vn_title": "Sakura no Toki -Sakura no Mori no Shita o Ayumu-", "vn_title_zh": "サクラノ刻－櫻の森の下を歩む－", "score": 4, "motto_rank": 21, "source": "VNDB", "source_url": "https://vndb.org/q9084", "vn_url": "https://vndb.org/v20431"}, {"id": "q3796", "quote": "I won't peer into the future. You should know better - carelessly seeing what's ahead can alter destiny in ways we never meant to.", "quote_zh": "我不会展望未来。你应该更清楚地知道——不小心看到未来会以我们意想不到的方式改变命运。", "quote_zh_source": "mt", "character": "Primula", "vn_id": "v25725", "vn_title": "SHUFFLE! Episode 2 ~Kami ni mo Akuma ni mo Nerawareteiru Otoko~", "vn_title_zh": "SHUFFLE! エピソード2～神にも悪魔にも狙われている男～", "score": 3, "motto_rank": 21, "source": "VNDB", "source_url": "https://vndb.org/q3796", "vn_url": "https://vndb.org/v25725"}, {"id": "q5826", "quote": "I wish you could've heard this, Sophie. But even if you never will: I'm still glad I did this.", "quote_zh": "我希望你能听到这个，索菲。但即使你永远不会：我仍然很高兴我做到了这一点。", "quote_zh_source": "mt", "character": "", "vn_id": "v49317", "vn_title": "Anamnesia", "vn_title_zh": "", "score": 3, "motto_rank": 21, "source": "VNDB", "source_url": "https://vndb.org/q5826", "vn_url": "https://vndb.org/v49317"}, {"id": "q8222", "quote": "The sensation of a hard, unbloodied blade, softly uniting with pulsing flesh. There can't be a greater stimulation for a human than that.", "quote_zh": "一种坚硬、未沾血的刀刃与脉动的肉体轻轻结合的感觉。对于人类来说，没有比这更大的刺激了。", "quote_zh_source": "mt", "character": "Toono Shiki", "vn_id": "v7", "vn_title": "Tsukihime", "vn_title_zh": "月姬", "score": 3, "motto_rank": 21, "source": "VNDB", "source_url": "https://vndb.org/q8222", "vn_url": "https://vndb.org/v7"}, {"id": "q2971", "quote": "Unlike the victim who can never forget what happened, the perpetrator forgets easily, for he thinks nothing of what he has done.", "quote_zh": "与永远无法忘记发生过的事情的受害者不同，施暴者很容易忘记，因为他对自己所做的事情毫不在意。", "quote_zh_source": "mt", "character": "", "vn_id": "v19726", "vn_title": "Eden-ui Neomeo", "vn_title_zh": "", "score": 2, "motto_rank": 21, "source": "VNDB", "source_url": "https://vndb.org/q2971", "vn_url": "https://vndb.org/v19726"}, {"id": "q3455", "quote": "You all see Different. You do Different... And yet you are all One and Whole. You are disunited from each other, and yet you are One Whole.", "quote_zh": "你们都看到了不同。你们做的不同......但你们都是一体的。你们彼此分离，但你们是一个整体。", "quote_zh_source": "mt", "character": "", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 2, "motto_rank": 21, "source": "VNDB", "source_url": "https://vndb.org/q3455", "vn_url": "https://vndb.org/v3144"}, {"id": "q3489", "quote": "No matter the outcome, I always believe that actions have the power to change rather than to be quiet and let your life unfold in front of you.", "quote_zh": "无论结果如何，我始终相信，行动比沉默更具有改变的力量，让你的生活在你面前展开。", "quote_zh_source": "mt", "character": "Kashiwagi Toyohisa", "vn_id": "v22855", "vn_title": "One Last Crane", "vn_title_zh": "", "score": 2, "motto_rank": 21, "source": "VNDB", "source_url": "https://vndb.org/q3489", "vn_url": "https://vndb.org/v22855"}, {"id": "q7620", "quote": "I've stepped in while she's putting on her stockings. Though, they may be pantyhose. Or are they tights? Why are there so many different names for womens' clothes?", "quote_zh": "她穿丝袜的时候我介入了。不过，它们可能是连裤袜。或者它们是紧身衣吗？为什么女装有这么多不同的名称？", "quote_zh_source": "mt", "character": "Kakei Kyoutarou", "vn_id": "v8158", "vn_title": "Daitoshokan no Hitsujikai", "vn_title_zh": "大図書館の羊飼い", "score": 2, "motto_rank": 21, "source": "VNDB", "source_url": "https://vndb.org/q7620", "vn_url": "https://vndb.org/v8158"}, {"id": "q4188", "quote": "There are gaps that can't be closed even if you practice. This applies to everything. That's why——nothing is even in this world.", "quote_zh": "即使你练习，也有无法弥补的差距。这适用于一切。所以——这个世界上什么都没有。", "quote_zh_source": "mt", "character": "Jinako Carigiri", "vn_id": "v12369", "vn_title": "Fate/EXTRA CCC", "vn_title_zh": "", "score": 1, "motto_rank": 21, "source": "VNDB", "source_url": "https://vndb.org/q4188", "vn_url": "https://vndb.org/v12369"}, {"id": "q6193", "quote": "It's believed their existence dates back to the first dark pacts, when humanity was only beginning to grasp the price of eternity.", "quote_zh": "人们相信它们的存在可以追溯到第一个黑暗契约，当时人类才刚刚开始掌握永恒的代价。", "quote_zh_source": "mt", "character": "Dakaria", "vn_id": "v58620", "vn_title": "Vaniar", "vn_title_zh": "", "score": 0, "motto_rank": 21, "source": "VNDB", "source_url": "https://vndb.org/q6193", "vn_url": "https://vndb.org/v58620"}, {"id": "q5093", "quote": "From now on, I will accept everything about you too. I will let myself go with the flow. We're going to the same destination, after all. And I leave the timing to you.", "quote_zh": "从今以后，我也会接受你的一切。我会让自己随波逐流。毕竟我们要去同一个目的地。我把时间留给你。", "quote_zh_source": "mt", "character": "Orie Lewak", "vn_id": "v40520", "vn_title": "Tenshi☆Souzou RE-BOOT!", "vn_title_zh": "天使嚣嚣 RE-BOOT!", "score": -1, "motto_rank": 21, "source": "VNDB", "source_url": "https://vndb.org/q5093", "vn_url": "https://vndb.org/v40520"}, {"id": "q2445", "quote": "I will never forget you. Even if this body decays and ends.", "quote_zh": "我永远不会忘记你。即使这个身体腐烂、终结。", "quote_zh_source": "mt", "character": "Fuen", "vn_id": "v47009", "vn_title": "Matsurika no Kei -kEi- Tenmeiin Iden", "vn_title_zh": "マツリカの炯-kEi- 天命胤異伝", "score": -2, "motto_rank": 21, "source": "VNDB", "source_url": "https://vndb.org/q2445", "vn_url": "https://vndb.org/v47009"}, {"id": "q7115", "quote": "I have no intention of doing that. Besides, if there is someone suitable to be the department head, I think that person should do it.", "quote_zh": "我无意这样做。另外，如果有一个人适合担任部门主管，我认为那个人就应该做。", "quote_zh_source": "mt", "character": "Imamiya Noriko", "vn_id": "v532", "vn_title": "Bra-Ban!", "vn_title_zh": "", "score": -2, "motto_rank": 21, "source": "VNDB", "source_url": "https://vndb.org/q7115", "vn_url": "https://vndb.org/v532"}, {"id": "q4313", "quote": "And frankly, after pulling a mischievous little stunt like that, your suffering is fair enough retribution.", "quote_zh": "坦白说，在做了这样一个淘气的小把戏之后，你的痛苦已经是足够公平的报应了。", "quote_zh_source": "mt", "character": "Yuri", "vn_id": "v21905", "vn_title": "Doki Doki Literature Club!", "vn_title_zh": "", "score": -12, "motto_rank": 21, "source": "VNDB", "source_url": "https://vndb.org/q4313", "vn_url": "https://vndb.org/v21905"}, {"id": "q2869", "quote": "He always buys things over 10,000 yen and pays it all with 1 yen coins. Since it's not a criminal act, the police can't do anything about it, either.", "quote_zh": "他总是买超过10,000日元的东西并用1日元硬币支付。由于这不是犯罪行为，警方也无能为力。", "quote_zh_source": "mt", "character": "", "vn_id": "v47", "vn_title": "Kagetsu Tooya", "vn_title_zh": "歌月十夜", "score": 30, "motto_rank": 20, "source": "VNDB", "source_url": "https://vndb.org/q2869", "vn_url": "https://vndb.org/v47"}, {"id": "q550", "quote": "Come, try to close your eyes. And try to remember. What form did you have?", "quote_zh": "来吧，试着闭上眼睛。并尝试记住。你有什么形式？", "quote_zh_source": "mt", "character": "", "vn_id": "v24", "vn_title": "Umineko no Naku Koro ni", "vn_title_zh": "海猫鸣泣之时", "score": 26, "motto_rank": 20, "source": "VNDB", "source_url": "https://vndb.org/q550", "vn_url": "https://vndb.org/v24"}, {"id": "q3456", "quote": "If the Road to Hell is paved with Good Intentions... It turns out that the Road to Heaven is paved with Evil.", "quote_zh": "如果通往地狱的路是由善意铺成的……那么事实证明，通往天堂的路是由邪恶铺成的。", "quote_zh_source": "mt", "character": "Mamiya Takuji", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 25, "motto_rank": 20, "source": "VNDB", "source_url": "https://vndb.org/q3456", "vn_url": "https://vndb.org/v3144"}, {"id": "q30", "quote": "I still haven't forgotten the last time you tried to sweet-talk me like this. I ended up having to molest Shikibe-senpai's naked body in the girl's bath.", "quote_zh": "我还没有忘记上次你这样对我甜言蜜语是什么时候。结果我不得不在女孩的浴室里调戏式部前辈的裸体。", "quote_zh_source": "mt", "character": "Arihara Nanami", "vn_id": "v22230", "vn_title": "RIDDLE JOKER", "vn_title_zh": "谜语小丑", "score": 23, "motto_rank": 20, "source": "VNDB", "source_url": "https://vndb.org/q30", "vn_url": "https://vndb.org/v22230"}, {"id": "q5607", "quote": "Be careful Yuri, you might cut yourself on that edge. oh wait, you already do don't you?", "quote_zh": "小心尤里，你可能会被那个边缘割伤。哦等等，你已经这样做了不是吗？", "quote_zh_source": "mt", "character": "Natsuki", "vn_id": "v21905", "vn_title": "Doki Doki Literature Club!", "vn_title_zh": "", "score": 20, "motto_rank": 20, "source": "VNDB", "source_url": "https://vndb.org/q5607", "vn_url": "https://vndb.org/v21905"}, {"id": "q4320", "quote": "If you’re facing an opponent you cannot defeat, then visualize something that will allow you to defeat them.", "quote_zh": "如果你面对一个你无法击败的对手，那么想象一些能让你击败他们的东西。", "quote_zh_source": "mt", "character": "Archer", "vn_id": "v11", "vn_title": "Fate/stay night", "vn_title_zh": "Fate/stay night", "score": 16, "motto_rank": 20, "source": "VNDB", "source_url": "https://vndb.org/q4320", "vn_url": "https://vndb.org/v11"}, {"id": "q539", "quote": "I always think this, but math class never seems to actually use numbers.", "quote_zh": "我一直这么认为，但数学课似乎从来没有真正使用过数字。", "quote_zh_source": "mt", "character": "Hase Hiroshi", "vn_id": "v9879", "vn_title": "Tsujidou-san no Jun'ai Road", "vn_title_zh": "辻堂さんの純愛ロード", "score": 15, "motto_rank": 20, "source": "VNDB", "source_url": "https://vndb.org/q539", "vn_url": "https://vndb.org/v9879"}, {"id": "q2565", "quote": "I can't believe I had the deepest orgasm of my life from the slightest touch.", "quote_zh": "我不敢相信我从最轻微的触摸中获得了一生中最深的高潮。", "quote_zh_source": "mt", "character": "Jougasaki Ayaka", "vn_id": "v24717", "vn_title": "Kin'iro Loveriche -Golden Time-", "vn_title_zh": "金色拉布利切 Golden Time", "score": 15, "motto_rank": 20, "source": "VNDB", "source_url": "https://vndb.org/q2565", "vn_url": "https://vndb.org/v24717"}, {"id": "q2996", "quote": "You fell asleep during Romeo and Juliet, and you're talking about LOVE?!", "quote_zh": "你在看《罗密欧与朱丽叶》时睡着了，却在谈论爱情？！", "quote_zh_source": "mt", "character": "Nellie Rhodes", "vn_id": "v12402", "vn_title": "Fata Morgana no Yakata", "vn_title_zh": "海市蜃楼之馆", "score": 15, "motto_rank": 20, "source": "VNDB", "source_url": "https://vndb.org/q2996", "vn_url": "https://vndb.org/v12402"}, {"id": "q1600", "quote": "She was a beautiful girl, and I thought she was beautiful even down to her butthole.", "quote_zh": "她是个漂亮的女孩，我觉得她连屁股都漂亮。", "quote_zh_source": "mt", "character": "", "vn_id": "v18806", "vn_title": "Natsu no Kusari", "vn_title_zh": "夏ノ鎖", "score": 14, "motto_rank": 20, "source": "VNDB", "source_url": "https://vndb.org/q1600", "vn_url": "https://vndb.org/v18806"}, {"id": "q4859", "quote": "Stop. Stop it! I've long since stopped knowing what you're talking about. Ever since around the «feminist invasion».", "quote_zh": "停止。停下来！我早就不知道你在说什么了。自从“女权主义入侵”以来。", "quote_zh_source": "mt", "character": "Hisao Nakai", "vn_id": "v945", "vn_title": "Katawa Shoujo", "vn_title_zh": "片羽少女", "score": 14, "motto_rank": 20, "source": "VNDB", "source_url": "https://vndb.org/q4859", "vn_url": "https://vndb.org/v945"}, {"id": "q4033", "quote": "By the way, I believe the good sir’s bush-beating just now translates as, “You’re a huge pain in the ass, but I can’t say no to the prince, Damn!’”", "quote_zh": "顺便说一句，我相信这位好先生刚才的喋喋不休可以翻译为：“你真是个讨厌鬼，但我不能对王子说不，该死！”", "quote_zh_source": "mt", "character": "Nagakura Sayo", "vn_id": "v2016", "vn_title": "Soukou Akki Muramasa", "vn_title_zh": "装甲恶鬼村正", "score": 13, "motto_rank": 20, "source": "VNDB", "source_url": "https://vndb.org/q4033", "vn_url": "https://vndb.org/v2016"}, {"id": "q5158", "quote": "\"Since you're this cute, we've definitely got to take on that skullfuck thing someday so I can try birthing you!\"", "quote_zh": "“既然你这么可爱，总有一天我们一定要接受那个混蛋的事情，这样我才能尝试生下你！”", "quote_zh_source": "mt", "character": "Minakami Yuki", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 13, "motto_rank": 20, "source": "VNDB", "source_url": "https://vndb.org/q5158", "vn_url": "https://vndb.org/v3144"}, {"id": "q953", "quote": "Hmm? Do I need a reason? I'm here because I'm a soldier, much like yourself. War is our profession, murder our currency.", "quote_zh": "唔？我需要理由吗？我来这里是因为我是一名士兵，就像你一样。战争是我们的职业，谋杀我们的货币。", "quote_zh_source": "mt", "character": "", "vn_id": "v548", "vn_title": "Dies irae ~Acta est Fabula~", "vn_title_zh": "", "score": 11, "motto_rank": 20, "source": "VNDB", "source_url": "https://vndb.org/q953", "vn_url": "https://vndb.org/v548"}, {"id": "q4584", "quote": "If one day I saw an irredeemably ugly face suddenly looking back at me in the mirror, I'd probably faint too.", "quote_zh": "如果有一天，我在镜子里看到一张丑陋到无可救药的脸突然回头看我，我可能也会晕倒。", "quote_zh_source": "mt", "character": "Matsunaga Sara", "vn_id": "v19373", "vn_title": "Ever17", "vn_title_zh": "永远的艾塞莉娅 DVD版", "score": 11, "motto_rank": 20, "source": "VNDB", "source_url": "https://vndb.org/q4584", "vn_url": "https://vndb.org/v19373"}, {"id": "q3461", "quote": "That's not true. There are lots of things you can do in your pajamas. Like sleeping, or sleeping, or laying around, or sleeping. You could even sleep in them!", "quote_zh": "那不是真的。穿着睡衣可以做很多事情。比如睡觉，或者睡觉，或者躺着，或者睡觉。您甚至可以睡在里面！", "quote_zh_source": "mt", "character": "", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 10, "motto_rank": 20, "source": "VNDB", "source_url": "https://vndb.org/q3461", "vn_url": "https://vndb.org/v3144"}, {"id": "q6598", "quote": "We'd be forever doomed to live out our days in the 'swabyss' - a deep, dark realm devoid of even the smallest speck of swag.", "quote_zh": "我们将永远注定要在“swabyss”中度过我们的日子——一个深邃、黑暗的国度，连一丁点的赃物都没有。", "quote_zh_source": "mt", "character": "", "vn_id": "v21002", "vn_title": "Danganronpa Forge:Re", "vn_title_zh": "", "score": 10, "motto_rank": 20, "source": "VNDB", "source_url": "https://vndb.org/q6598", "vn_url": "https://vndb.org/v21002"}, {"id": "q2817", "quote": "When people say \"It's about someone I know\" or \"It's about my friend\", it's about themselves most of the time.", "quote_zh": "当人们说“这是关于我认识的人”或“这是关于我的朋友”时，大多数时候是关于他们自己的。", "quote_zh_source": "mt", "character": "Arihara Nanami", "vn_id": "v22230", "vn_title": "RIDDLE JOKER", "vn_title_zh": "谜语小丑", "score": 9, "motto_rank": 20, "source": "VNDB", "source_url": "https://vndb.org/q2817", "vn_url": "https://vndb.org/v22230"}, {"id": "q4440", "quote": "You're the worst piece of scum that has ever walked this planet. You should make 'scummity scum scum' into your catch phrase.", "quote_zh": "你是这个星球上最糟糕的败类。你应该把“scummity scum scum”作为你的口号。", "quote_zh_source": "mt", "character": "Senri Akane", "vn_id": "v751", "vn_title": "Rewrite", "vn_title_zh": "Rewrite", "score": 9, "motto_rank": 20, "source": "VNDB", "source_url": "https://vndb.org/q4440", "vn_url": "https://vndb.org/v751"}, {"id": "q308", "quote": "I don't think falling in love so you can die is particularly commonplace.", "quote_zh": "我不认为坠入爱河而死是特别常见的事情。", "quote_zh_source": "mt", "character": "", "vn_id": "v19397", "vn_title": "Steam Prison", "vn_title_zh": "", "score": 8, "motto_rank": 20, "source": "VNDB", "source_url": "https://vndb.org/q308", "vn_url": "https://vndb.org/v19397"}, {"id": "q3852", "quote": "I’d grown bored of the tuna sandwiches, so I invented my own version, a slice of bread between two pieces of meat.", "quote_zh": "我厌倦了金枪鱼三明治，所以我发明了自己的版本，在两块肉之间放一片面包。", "quote_zh_source": "mt", "character": "", "vn_id": "v17", "vn_title": "Ever17 -the out of infinity-", "vn_title_zh": "永远的艾塞莉娅 DVD版", "score": 8, "motto_rank": 20, "source": "VNDB", "source_url": "https://vndb.org/q3852", "vn_url": "https://vndb.org/v17"}, {"id": "q3855", "quote": "Coco shook my body hard, pried open my eyelids, poured saltwater into my eyes, and even shoved hydrogen peroxide up my nose.", "quote_zh": "可可用力摇晃我的身体，撬开我的眼皮，往我的眼睛里倒盐水，甚至把双氧水塞进我的鼻子里。", "quote_zh_source": "mt", "character": "", "vn_id": "v17", "vn_title": "Ever17 -the out of infinity-", "vn_title_zh": "永远的艾塞莉娅 DVD版", "score": 8, "motto_rank": 20, "source": "VNDB", "source_url": "https://vndb.org/q3855", "vn_url": "https://vndb.org/v17"}, {"id": "q6075", "quote": "Spirytus vodka. Good for disinfecting wounds in a pinch, and also does a fine job of setting things on fire.", "quote_zh": "斯皮里图斯伏特加。非常适合在紧要关头消毒伤口，也能很好地点燃东西。", "quote_zh_source": "mt", "c character": "Erika Barkhausen", "vn_id": "v61829", "vn_title": "My Last War", "vn_title_zh": "", "score": 1, "motto_rank": 19, "source": "VNDB", "source_url": "https://vndb.org/q7775", "vn_url": "https://vndb.org/v61829"}, {"id": "q7894", "quote": "If you don't mind..... Can I take you to a special place? ... To the place, where dreams come true.", "quote_zh": "如果你不介意的话……我可以带你去一个特别的地方吗？ ... 到梦想成真的地方。", "quote_zh_source": "mt", "character": "Furukawa Nagisa", "vn_id": "v4", "vn_title": "CLANNAD", "vn_title_zh": "CLANNAD", "score": 1, "motto_rank": 19, "source": "VNDB", "source_url": "https://vndb.org/q7894", "vn_url": "https://vndb.org/v4"}, {"id": "q8531", "quote": "I'm sure it gets taken as unwelcomed kindness by some, but I'd rather be a hypocrite than stand by and do nothing. If I bother someone, I can just give an honest apology.", "quote_zh": "我确信这会被一些人视为不受欢迎的善意，但我宁愿做一个伪君子，也不愿袖手旁观。如果我打扰了别人，我可以诚实地道歉。", "quote_zh_source": "mt", "character": "Kisaki Reina", "vn_id": "v21852", "vn_title": "Kin'iro Loveriche", "vn_title_zh": "金色拉布利切", "score": 1, "motto_rank": 19, "source": "VNDB", "source_url": "https://vndb.org/q8531", "vn_url": "https://vndb.org/v21852"}, {"id": "q8565", "quote": "I hope you two have a long, fruitful relationship, throw a lavish and wholly impractical wedding ceremony, and pop out 1.3 children.", "quote_zh": "我希望你们两个拥有长久而富有成果的关系，举办一场奢华且完全不切实际的婚礼，并生下 1.3 个孩子。", "quote_zh_source": "mt", "character": "", "vn_id": "v54117", "vn_title": "Maid For My Master", "vn_title_zh": "", "score": 1, "motto_rank": 19, "source": "VNDB", "source_url": "https://vndb.org/q8565", "vn_url": "https://vndb.org/v54117"}, {"id": "q8798", "quote": "It's not because I am a sex maniac, it's because there is way too much attractive porn in this world.", "quote_zh": "这并不是因为我是一个性狂，而是因为这个世界上有太多有吸引力的色情内容。", "quote_zh_source": "mt", "character": "Yuzuki Makoto", "vn_id": "v52345", "vn_title": "Boku o Hottokenai Futari no Gyaru ~Inkya no Otaku ga Muchimuchi Dosukebe Gyaru to Ero San  "https://vndb.org/v8020"}, {"id": "q9560", "quote": "Your sins will never forgive you. You have done something that can never be forgiven. Just remember that.", "quote_zh": "你的罪孽永远不会原谅你。你做了一些永远无法被原谅的事情。只要记住这一点。", "quote_zh_source": "mt", "character": "Yoshino Takafumi", "vn_id": "v54472", "vn_title": "lesson", "vn_title_zh": "", "score": 1, "motto_rank": 19, "source": "VNDB", "source_url": "https://vndb.org/q9560", "vn_url": "https://vndb.org/v54472"}, {"id": "q1273", "quote": "Children often go astray, not because of bad nature, but because of lack of recognition with love.", "quote_zh": "孩子常常误入歧途，不是因为本性不好，而是因为缺乏爱的认可。", "quote_zh_source": "mt", "character": "Miao Pinhong", "vn_id": "v16714", "vn_title": "Wuyue Moli Episode 01 - Hewei Shen?", "vn_title_zh": "五月茉莉 首部曲-何謂神？", "score": 0, "motto_rank": 19, "source": "VNDB", "source_url": "https://vndb.org/q1273", "vn_url": "https://vndb.org/v16714"}, {"id": "q1983", "quote": "Become a hero because you willed it, not because of bullcrap someone said hundreds of years ago.", "quote_zh": "成为英雄是因为你愿意，而不是因为几百年前某人说的废话。", "quote_zh_source": "mt", "character": "", "vn_id": "v34831", "vn_title": "Hero's Advent", "vn_title_zh": "", "score": 0, "motto_rank": 19, "source": "VNDB", "source_url": "https://vndb.org/q1983", "vn_url": "https://vndb.org/v34831"}, {"id": "q2272", "quote": "If the world is hell and we hope for heaven, then we should choose death the day we are born.", "quote_zh": "如果世界是地狱而我们希望天堂，那么我们应该在出生的那天选择死亡。", "quote_zh_source": "mt", "character": "He Yucheng", "vn_id": "v16714", "vn_title": "Wuyue Moli Episode 01 - Hewei Shen?", "vn_title_zh": "五月茉莉 首部曲-何謂神？", "score": 0, "motto_rank": 19, "source": "VNDB", "source_url": "https://vndb.org/q2272", "vn_url": "https://vndb.org/v16714"}, {"id": "q2598", "quote": "You can't say you're sorry and then just immediately go back to doing the thing you were sorry about!", "quote_zh": "你不能说你很抱歉，然后立即回去做你感到抱歉的事情！", "quote_zh_source": "mt", "character": "Rook", "vn_id": "v50731", vndb.org/v60582"}, {"id": "q7968", "quote": "Hope? Ah... 'hope' is a self-deception. An illusion sold to those who have nothing left to steal.", "quote_zh": "希望？啊……“希望”是一种自欺欺人。幻象卖给了那些没有什么可偷的人。", "quote_zh_source": "mt", "character": "Boris", "vn_id": "v60582", "vn_title": "Blestjaschij Neon - Polutonnyj Rezonans", "vn_title_zh": "", "score": 0, "motto_rank": 19, "source": "VNDB", "source_url": "https://vndb.org/q7968", "vn_url": "https://vndb.org/v60582"}, {"id": "q8243", "quote": "Besides that, I ran out of concentration in the middle, so I was monitoring him in my sleep.", "quote_zh": "除此之外，我中间注意力不集中，所以我在睡梦中监视着他。", "quote_zh_source": "mt", "character": "Inohara Masato", "vn_id": "v5", "vn_title": "Little Busters!", "vn_title_zh": "Little Busters!", "score": 0, "motto_rank": 19, "source": "VNDB", "source_url": "https://vndb.org/q8243", "vn_url": "https://vndb.org/v5"}, {"id": "q8991", "quote": "Got it? Come fold newspapers with me tomorrow. I'll show you the truth about the universe and everything.", "quote_zh": "知道了？明天跟我一起叠报纸吧。我将向你展示宇宙和一切的真相。", "quote_zh_source": "mt", "character": "Shirasato Karin", "vn_id": "v11072", "vn_title": "Chiisana Kanojo no Serenade", "vn_title_zh": "ちいさな彼女の小夜曲", "score": 0, "motto_rank": 19, "source": "VNDB", "source_url": "https://vndb.org/q8991", "vn_url": "https://vndb.org/v11072"}, {"id": "q9421", "quote": "That statement was weird and really embarrassing, so I ignored it and pulled down her panties instead.", "quote_zh": "这句话很奇怪，也很尴尬，所以我没有理会它，而是拉下了她的内裤。", "quote_zh_source": "mt", "character": "", "vn_id": "v3144", "vn_title": "Subarashiki Hibi ~Furenzoku Sonzai~", "vn_title_zh": "美好的日常 ～不连续的存在～", "score": 0, "motto_rank": 19, "source": "VNDB", "source_url": "https://vndb.org/q9421", "vn_url": "https://vndb.org/v3144"}, {"id": "q2271", "quote": "People live for hope. Because of it, we have the courage to move on.", "quote_zh": "人活着就是为了希望。正因为如此，我们才有继续前行的勇气。", "quote_zh_source": "mt", "character": "Miao Pinhong", "vn_id": "v16714", "v ": "我无法控制自己。我一定有难以忍受的刺痛的弱点。", "quote_zh_source": "mt", "character": "Rose Lalonde", "vn_id": "v31659", "vn_title": "Homestuck", "vn_title_zh": "", "score": 4, "motto_rank": 15, "source": "VNDB", "source_url": "https://vndb.org/q5895", "vn_url": "https://vndb.org/v31659"}, {"id": "q6866", "quote": "All Japanese civilians have some experience in judo or kendo, and half of them are tsundere.", "quote_zh": "日本平民都有一定的柔道或者剑道经验，其中一半都是傲娇的。", "quote_zh_source": "mt", "character": "Kazami Yuuji", "vn_id": "v19072", "vn_title": "Grisaia no Senritsu", "vn_title_zh": "グリザイアの旋律", "score": 4, "motto_rank": 15, "source": "VNDB", "source_url": "https://vndb.org/q6866", "vn_url": "https://vndb.org/v19072"}, {"id": "q8627", "quote": "Even if they are locked away in a cage, as long as they have wings, birds can dream of the wide-open sky.", "quote_zh": "即使被关在笼子里，只要有翅膀，鸟儿就能梦想着广阔的天空。", "quote_zh_source": "mt", "character": "Sion", "vn_id": "v1286", "vn_title": "eden* They were only two, on the planet.", "vn_title_zh": "", "score": 4, "motto_rank": 15, "source": "VNDB", "source_url": "https://vndb.org/q8627", "vn_url": "https://vndb.org/v1286"}, {"id": "q1925", "quote": "Freedom and joy are foreign to your life. Punishment is all that awaits one born as a witch.", "quote_zh": "自由和快乐对你的生活来说是陌生的。等待着作为魔女出生的人的，只有惩罚。", "quote_zh_source": "mt", "character": "Evelina Lynzel", "vn_id": "v32555", "vn_title": "even if TEMPEST: Yoiyami ni Kaku Katariki Majo", "vn_title_zh": "even if TEMPEST 宵闇にかく語りき魔女", "score": 3, "motto_rank": 15, "source": "VNDB", "source_url": "https://vndb.org/q1925", "vn_url": "https://vndb.org/v32555"}, {"id": "q2069", "quote": "Please don't be too unfaithful. The truth is, I don't want you to be liked by anyone other than me.", "quote_zh": "请不要太不忠。说实话，我不想让除了我以外的任何人喜欢你。", "quote_zh_source": "mt", "character": "Peter White", "vn_id": "v801", "vn_title": "Heart no Kuni no Alice ~Wonderful Wonder World~", "vn_title_zh": "ハートの国のアリス～ Wonderful Wonder World ～", "score": 3, "motto_rank": 15, "source": "VNDB", "source_url": "https://vndb.org/q2069", "vn_url": "https://vndb.org/v801"}, {"id": "q4160", "quote": "If the end of the world comes suddenly, Voyager 1 will be the proof that humans and the Earth have existed.", "quote_zh": "如果世界末日突然到来，航海者一号将成为人类和地球曾经存在过的证明。", "quote_zh_source": "mt", "character": "Deng Kangsui", "vn_id": "v54201", "vn_title": "Liuguang Yishi de Xiamo", "vn_title_zh": "流光易逝的夏末", "score": 3, "motto_rank": 15, "source": "VNDB", "source_url": "https://vndb.org/q4160", "vn_url": "https://vndb.org/v54201"}, {"id": "q6071", "quote": "Everyone here is sick. It's just a matter of whether it's a sickness of the body or a sickness of the mind.", "quote_zh": "这里的每个人都病了。这只是身体有病还是心灵有病的问题。", "quote_zh_source": "mt", "character": "", "vn_id": "v18739", "vn_title": "narcissu Sumire", "vn_title_zh": "", "score": 3, "motto_rank": 15, "source": "VNDB", "source_url": "https://vndb.org/q6071", "vn_url": "https://vndb.org/v18739"}, {"id": "q6077", "quote": "Fate is just a name man gives to the past. If you ask me, those walls were just fated to break.", "quote_zh": "命运只是人们给过去起的一个名字。如果你问我，那些墙注定会被打破。", "quote_zh_source": "mt", "character": "Nishime Hikaru", "vn_id": "v32758", "vn_title": "Ihanashi no Majo", "vn_title_zh": "イハナシの魔女", "score": 3, "motto_rank": 15, "source": "VNDB", "source_url": "https://vndb.org/q6077", "vn_url": "https://vndb.org/v32758"}, {"id": "q6443", "quote": "Cheating is a part of love. If you are interested in many girls, it means that your love can't be stopped.", "quote_zh": "欺骗是爱情的一部分。如果你对很多女孩感兴趣，说明你的爱无法停止。", "quote_zh_source": "mt", "character": "Kuon Shikka", "vn_id": "v56364", "vn_title": "Shuuten Kyoudan", "vn_title_zh": "終天教団", "score": 3, "motto_rank": 15, "source": "VNDB", "source_url": "https://vndb.org/q6443", "vn_url": "https://vndb.org/v56364"}, {"id": "q8012", "quote": "You let one demonic cat girl into your life, and suddenly everything starts to fall apart.", "quote_zh": "你让一只恶魔猫女孩进入你的生活，突然一切都开始崩溃。", "quote_zh_source": "mt", "character": "Robin Hawkins", "vn_id": "v20501", "vn_title": "Sweetest Monster", "vn_title_zh": "", "score": 3, "motto_rank": 15, "source": "VNDB", "source_url": "https://vndb.org/q8012", "vn_url": "https://vndb.org/v20501"}, {"id": "q8024", "quote": "We'll leave you with nothing! We won't even leave the hairs on your butt!!", "quote_zh": "我们不会让你一无所有！我们连屁股上的毛都不留！！", "quote_zh_source": "mt", "character": "Maebara Keiichi", "vn_id": "v67", "vn_title": "Higurashi no Naku Koro ni", "vn_title_zh": "寒蝉鸣泣之时", "score": 3, "motto_rank": 15, "source": "VNDB", "source_url": "https://vndb.org/q8024", "vn_url": "https://vndb.org/v67"}, {"id": "q8099", "quote": "Such a terrible life shouldn't exist. It's like a bad American joke. Or maybe a Jewish joke.", "quote_zh": "这样可怕的生活不应该存在。这就像一个糟糕的美国笑话。或者也许是一个犹太笑话。", "quote_zh_source": "mt", "character": "Kuwagata Takuma", "vn_id": "v914", "vn_title": "SWAN SONG", "vn_title_zh": "天鹅之歌", "score": 3, "motto_rank": 15, "source": "VNDB", "source_url": "https://vndb.org/q8099", "vn_url": "https://vndb.org/v914"}, {"id": "q8227", "quote": "Am I really about to be rejected because of anal? Tell me the ass didn't just ruin our shot at happiness.", "quote_zh": "我真的会因为肛交而被拒绝吗？告诉我，屁股不仅仅毁了我们获得幸福的机会。", "quote_zh_source": "mt", "character": "", "vn_id": "v30456", "vn_title": "HajiLove -Making * Lovers-", "vn_title_zh": "", "score": 3, "motto_rank": 15, "source": "VNDB", "source_url": "https://vndb.org/q8227", "vn_url": "https://vndb.org/v30456"}, {"id": "q9217", "quote": "To any one person, the ever-expanding dominion of humanity has all but lost its meaning. It is enough simply to have a place to belong. Perhaps that is why decline began.", "quote_zh": "对于任何一个人来说，不断扩张的人类统治几乎已经失去了意义。只要有一个归属的地方就足够了。也许这就是衰落开始的原因。", "quote_zh_source": "mt", "character": "", "vn_id": "v1278", "vn_title": "Saihate no Ima", "vn_title_zh": "最果てのイマ", "score": 3, "motto_rank": 15, "source": "VNDB", "source_url": "https://vndb.org/q9217", "vn_url": "https://vndb.org/v1278"}, {"id": "q235", "quote": "Okay then, brother. Always be sure to protect me. This is an order from your little sister.", "quote_zh": "那么好吧，兄弟。一定要永远保护我。这是你妹妹的命令。", "quote_zh_source": "mt", "character": "", "vn_id": "v5871", "vn_title": "Sukimazakura to Uso no Machi", "vn_title_zh": "すきま桜とうその都会", "score": 2, "motto_rank": 15, "source": "VNDB", "source_url": "https://vndb.org/q235", "vn_url": "https://vndb.org/v5871"}, {"id": "q906", "quote": "I don't have a girlfriend, but I'm determined to get one this year. Too bad it's not easy as flipping a switch. Girlfriend on, girlfriend off.", "quote_zh": "我还没有女朋友，但我决心今年要找一个。太糟糕了，这并不像扳动开关那么容易。女朋友上，女朋友下。", "quote_zh_source": "mt", "character": "", "vn_id": "v700", "vn_title": "Ar tonelico ~Sekai no Owari de Utai Tsuzukeru Shoujo~", "vn_title_zh": "アルトネリコ世界の終わりで詩い続ける少女", "score": 2, "motto_rank": 15, "source": "VNDB", "source_url": "https://vndb.org/q906", "vn_url": "https://vndb.org/v700"}, {"id": "q2074", "quote": "Cute girls in short skirts are the stuff dreams are made of. Plus hope, and happiness too.", "quote_zh": "可爱的短裙女孩是梦想的组成部分。还有希望，还有幸福。", "quote_zh_source": "mt", "character": "", "vn_id": "v32021", "vn_title": "Kunado Kokuki", "vn_title_zh": "クナド国記", "score": 2, "motto_rank": 15, "source": "VNDB", "source_url": "https://vndb.org/q2074", "vn_url": "https://vndb.org/v32021"}, {"id": "q3799", "quote": "I heard in the human world, sharing an umbrella or drawing one with names means eternal love...", "quote_zh": "听说在人间，共用一把伞或者画上名字，就是永恒的爱情……", "quote_zh_source": "mt", "character": "Lithia", "vn_id": "v25725", "vn_title": "SHUFFLE! Episode 2 ~Kami ni mo Akuma ni mo Nerawareteiru Otoko~", "vn_title_zh": "SHUFFLE! エピソード2～神にも悪魔にも狙われている男～", "score": 2, "motto_rank": 15, "source": "VNDB", "source_url": "https://vndb.org/q3799", "vn_url": "https://vndb.org/v25725"}, {"id": "q4205", "quote": "Memories are unnecessary to know a person's true nature, but are essential for quality love.", "quote_zh": "记忆对于了解一个人的真实本性来说是   <script>
(() => {
  const LS_KEY = "gal-quotes-approved-v1";
  const boot = JSON.parse(document.getElementById("bootstrap").textContent);
  let quotes = boot.quotes || [];
  let approved = { ...(boot.approved || {}) };
  let apiOk = false;

  const $ = (s) => document.querySelector(s);
  const listEl = $("#list");
  const statsEl = $("#stats");
  const toastEl = $("#toast");

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("is-on");
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove("is-on"), 1800);
  }

  function displayZh(q) {
    const rec = approved[q.id];
    if (rec && rec.quote_zh) return rec.quote_zh;
    return q.quote_zh || q.quote || "";
  }

  function isApproved(id) {
    return !!(approved[id] && approved[id].approved);
  }

  function filtered() {
    const q = ($("#q").value || "").trim().toLowerCase();
    const f = $("#filter").value;
    return quotes.filter((row) => {
      if (f === "approved" && !isApproved(row.id)) return false;
      if (f === "pending" && isApproved(row.id)) return false;
      if (f === "no-zh") {
        const zh = (approved[row.id] && approved[row.id].quote_zh) || row.quote_zh;
        if (zh) return false;
      }
      if (!q) return true;
      const hay = [
        row.quote, row.quote_zh, row.vn_title, row.vn_title_zh,
        row.character, row.id,
      ].join(" ").toLowerCase();
      return hay.includes(q);
    });
  }

  function renderList() {
    const rows = filtered();
    const kept = quotes.filter((q) => isApproved(q.id)).length;
    statsEl.textContent = `显示 ${rows.length} / ${quotes.length} · 已保留 ${kept}`;
    const scrollTop = listEl.scrollTop;
    listEl.innerHTML = rows.map((row) => {
      const zh = displayZh(row);
      const cls = ["item"];
      if (isApproved(row.id)) cls.push("is-approved");
      return `<div class="${cls.join(" ")}" data-id="${row.id}">
        <label class="item__check" title="保留">
          <input type="checkbox" class="item-approve" data-id="${row.id}" ${isApproved(row.id) ? "checked" : ""} aria-label="保留这条名言">
        </label>
        <div class="item__body">
          <p class="item__zh">${esc(zh)}</p>
          <p class="item__orig">${esc(row.quote)}</p>
          <div class="item__meta">
            <span>《${esc(row.vn_title_zh || row.vn_title)}》</span>
            ${row.character ? `<span>${esc(row.character)}</span>` : ""}
            <a href="${esc(row.source_url)}" target="_blank" rel="noopener">VNDB</a>
            <span class="badge">名言 ${row.motto_rank || row.score}</span>
          </div>
        </div>
      </div>`;
    }).join("");
    listEl.scrollTop = scrollTop;
  }

  async function saveApprove(id, ok) {
    const row = quotes.find((q) => q.id === id);
    if (!row) return;
    const zh = displayZh(row);
    approved[id] = {
      approved: !!ok,
      quote_zh: zh,
      updated_at: new Date().toISOString(),
    };
    localStorage.setItem(LS_KEY, JSON.stringify(approved));
    if (apiOk) {
      try {
        await fetch("/api/approve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, approved: !!ok, quote_zh: zh }),
        });
        toast(ok ? "已保留" : "已取消保留");
      } catch (e) {
        toast("保存失败（仅 localStorage）");
      }
    } else {
      toast(ok ? "已保留（仅浏览器缓存）" : "已取消保留");
    }
    renderList();
  }

  function esc(s) {
    return String(s ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function debounce(fn, ms) {
    let t;
    return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  }

  listEl.addEventListener("change", (e) => {
    const cb = e.target.closest(".item-approve");
    if (!cb) return;
    e.stopPropagation();
    saveApprove(cb.dataset.id, cb.checked);
  });

  $("#q").addEventListener("input", debounce(renderList, 120));
  $("#filter").addEventListener("change", renderList);

  $("#export-json").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(approved, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "approved.json";
    a.click();
    URL.revokeObjectURL(a.href);
    toast("已下载 approved.json");
  });

  $("#open-approved").addEventListener("click", () => {
    window.open("approved.html", "_blank");
  });

  async function probeApi() {
    try {
      const r = await fetch("/api/ping", { method: "GET" });
      apiOk = r.ok;
    } catch {
      apiOk = false;
    }
    try {
      const ls = localStorage.getItem(LS_KEY);
      if (ls) {
        const parsed = JSON.parse(ls);
        approved = { ...approved, ...parsed };
      }
    } catch {}
    renderList();
  }

  probeApi();
})();
  </script>
</body>
</html>
